<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Openvolley Apps</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="landing.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>

<body>
    <div class="container" id="main-container">
        <img id="hero-ball" src="ball.png" alt="Openvolley Ball" class="hero-image">
        <h1 class="title">Openvolley eScoresheet</h1>

        <div class="main-options">
            <div class="option-card" onclick="openMenu('indoor')">
                <img src="indoor_icon.png" alt="Indoor Icon" class="option-icon"
                    style="aspect-ratio:1; width:180px; object-fit: contain;">
                <div class="option-title">Indoor Volleyball</div>
            </div>

            <div class="option-card" onclick="openMenu('beach')" 
                 onmouseenter="changeBall('beach')" 
                 onmouseleave="changeBall('indoor')">
                <img src="openbeach_no_bg.png" alt="Beach Icon" class="option-icon"
                    style="aspect-ratio:1; width:180px; object-fit: contain;">
                <div class="option-title">Beach Volleyball</div>
            </div>
        </div>

        <h2 class="subtitle">ReadVolley - Rules database</h2>
        
        <a href="https://readvolley.openvolley.app" class="option-card readvolley-card" 
           style="text-decoration: none; color: inherit;"
           onmouseenter="changeBall('readvolley')" 
           onmouseleave="changeBall('indoor')">
            <img src="readvolley.png" alt="Readvolley Icon" class="option-icon"
                style="aspect-ratio:1; width:180px; object-fit: contain;">
            <div class="option-title">Readvolley</div>
        </a>
    </div>

    <!-- Indoor Menu -->
    <div class="sub-menu" id="menu-indoor">
        <button class="close-menu" onclick="closeMenu('indoor')" aria-label="Close Indoor Menu">
            <i class="bi bi-x-lg"></i>
        </button>
        <div class="menu-grid">
            <a href="https://app.openvolley.app" class="menu-item highlight">
              <img src="indoor_icon.png" alt="Indoor Icon" class="option-icon"
                    style="aspect-ratio:1; width:180px; object-fit: contain;">
                <div>
                    <div class="item-title">Main eScoresheet</div>
                </div>
            </a>

            <a href="https://referee.openvolley.app" class="menu-item">
                <img src="referee_icon.png" class="item-icon" alt="Referee" style="filter: brightness(0) invert(1);">
                <div class="item-title">Referee Dashboard</div>
            </a>

            <a href="https://bench.openvolley.app" class="menu-item">
                <i class="bi bi-people item-icon"></i>
                <div class="item-title">Bench Dashboard</div>
            </a>

            <a href="https://roster.openvolley.app" class="menu-item">
                <i class="bi bi-file-earmark-person item-icon"></i>
                <div class="item-title">Roster Upload</div>
            </a>

            <a href="https://livescore.openvolley.app" class="menu-item">
                <i class="bi bi-broadcast item-icon"></i>
                <div class="item-title">Livescore</div>
            </a>

            <a href="https://scoresheet.openvolley.app" class="menu-item">
                <i class="bi bi-database item-icon"></i>
                <div class="item-title">Scoresheet DB</div>
            </a>
        </div>
    </div>

    <!-- Beach Menu -->
    <div class="sub-menu" id="menu-beach">
        <button class="close-menu" onclick="closeMenu('beach')" aria-label="Close Beach Menu">
            <i class="bi bi-x-lg"></i>
        </button>
        <div class="menu-grid">
            <a href="https://beach.openvolley.app" class="menu-item highlight">
                <img src="openbeach_no_bg.png" alt="Beach Icon" class="option-icon"
                    style="aspect-ratio:1; width:180px; object-fit: contain;">
                <div>
                    <div class="item-title">Main eScoresheet</div>
                </div>
            </a>

            <a href="https://beach_referee.openvolley.app" class="menu-item">
                <img src="referee_icon.png" class="item-icon" alt="Referee" style="filter: brightness(0) invert(1);">
                <div class="item-title">Referee Dashboard</div>
            </a>

            <a href="https://beach_scoresheet.openvolley.app" class="menu-item">
                <i class="bi bi-database item-icon"></i>
                <div class="item-title">Scoresheet DB</div>
            </a>
        </div>
    </div>

    <script src="landing.js"></script>
</body>

</html>
