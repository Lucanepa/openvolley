# gitleaks config for the Lucanepa repos.
#
# Written 2026-08-13 after the stock ruleset scored a website repo 0 leaks while a
# real DeepL API key sat in its history at aad8f9a: gitleaks ships no DeepL rule
# and a UUID-shaped key does not trip the generic entropy heuristics.
#
# Lesson encoded here: the default ruleset is a floor, not a ceiling. Every
# credential format this stack actually uses needs an explicit rule.
#
# Regression test: .githooks/test-gitleaks-config.sh (builds fake secrets at
# runtime and checks which rules fire). Run it after editing this file.
# Needs gitleaks >= 8.25 for the [[allowlists]] targetRules blocks below.

[extend]
useDefault = true

[[rules]]
id = "deepl-api-key-free"
description = "DeepL API key (Free tier — UUID with :fx suffix)"
regex = '''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:fx'''
keywords = [":fx"]

[[rules]]
id = "deepl-api-key-assignment"
description = "DEEPL_API_KEY / DEEPL_KEY assigned a non-placeholder value (catches Pro keys, which have no :fx)"
# openvolley's scripts/translate.js reads DEEPL_KEY, so "api" is optional.
regex = '''(?i)deepl[_-]?(?:api[_-]?)?key["'\s]*[:=]["'\s]*([0-9a-zA-Z\-:]{20,})'''
secretGroup = 1
keywords = ["deepl"]
allowlists = [
  { regexes = ['''(?i)(your|example|placeholder|xxx+|<[^>]+>|\$\{?[A-Z_]+\}?|changeme|redacted)'''] },
]

[[rules]]
id = "directus-static-token"
description = "Directus static/admin token assignment"
regex = '''(?i)directus[_-]?(admin[_-]?)?token["'\s]*[:=]["'\s]*([0-9a-zA-Z._\-]{20,})'''
keywords = ["directus"]
allowlists = [
  { regexes = ['''(?i)(your|example|placeholder|xxx+|<[^>]+>|\$\{?[A-Z_]+\}?|secrets\.|process\.env|import\.meta\.env)'''] },
]

# Supabase legacy keys are JWTs whose payload carries "role". The anon key is
# publishable (it ships in every browser bundle); service_role bypasses RLS.
# The payload is base64url, so match "service_role" at each of the three
# possible byte alignments instead of decoding.
[[rules]]
id = "supabase-service-role-jwt"
description = "Supabase service_role JWT (bypasses RLS — must never leave the backend)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]*(?:c2VydmljZV9yb2xl|NlcnZpY2Vfcm9s|zZXJ2aWNlX3Jv)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]{20,}'''
keywords = ["eyJ"]

[[rules]]
id = "supabase-secret-api-key"
description = "Supabase new-style secret API key (sb_secret_…; sb_publishable_ is public)"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "resend-api-key"
description = "Resend API key (re_<id>_<secret>)"
regex = '''\b(re_[A-Za-z0-9]{6,}_[A-Za-z0-9]{16,})\b'''
secretGroup = 1
entropy = 3.0
keywords = ["re_"]

[[rules]]
id = "openvolley-env-secret"
description = "A secret env var this stack reads (SMTP, Resend, Supabase service role, PocketBase admin, DeepL, TLS key, Postgres, publish tokens) assigned a literal"
regex = '''(?i)\b[A-Z0-9_]*(?:SMTP_PASS(?:WORD)?|RESEND_API_KEY|SERVICE_ROLE_KEY|POCKETBASE_ADMIN_PASSWORD|PB_ADMIN_PASSWORD|DEEPL(?:_API)?_KEY|SSL_KEY_BASE64|LIVE_PUBLISH_TOKEN|REOPEN_PASSWORD_HASH|POSTGRES_PASSWORD|PGPASSWORD|JWT_SECRET)\b["'\s]*[:=][ \t]*["']?([^\s"'`$<{]{8,})'''
secretGroup = 1
keywords = ["smtp_pass", "resend_api_key", "service_role_key", "admin_password", "deepl", "ssl_key_base64", "live_publish_token", "reopen_password_hash", "postgres_password", "pgpassword", "jwt_secret"]
allowlists = [
  # Values that are references, not literals: env.X, process.env.X, secrets.X, a ternary/expression.
  { regexes = ['''(?i)^(?:process\.|import\.meta|env\.|secrets\.|vars\.|os\.environ|getenv|req\.|config\.)'''] },
  { regexes = ['''(?i)(your[_\- ]|example|placeholder|xxx+|change[_\- ]?me|replace[_\- ]?me|redacted|\.\.\.|\*\*\*)'''] },
  # JS/TS object properties whose value is code, not a literal (an unquoted JS
  # literal cannot exist): `SMTP_PASS: smtpPass,` and
  # `SERVICE_ROLE_KEY: z.string().min(1),`. Only an identifier/dotted path that
  # ends in , or ; or continues into a call, so a bare dotenv value
  # (SMTP_PASS=Abc123xyz) is still reported.
  { regexes = [
    '''^[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*[,;]$''',
    '''^[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*\(''',
  ] },
  # Well-known dev defaults in compose files (POSTGRES_PASSWORD: postgres).
  { regexes = ['''(?i)^(?:postgres|password|passwort|changeme)$'''] },
]

[[rules]]
id = "postgres-uri-password"
description = "postgres:// connection string with an inline password"
regex = '''(?i)\bpostgres(?:ql)?://[^:@/\s"'`]+:([^@\s/"'`]{6,})@'''
secretGroup = 1
keywords = ["postgres://", "postgresql://"]
allowlists = [
  { regexes = ['''(?i)^(?:password|postgres|pass|secret|changeme|example|placeholder|xxx+|\$.*|<.*>|\{.*\}|\*+)$'''] },
]

[[rules]]
id = "base64-pem-private-key"
description = "Base64-encoded PEM private key (e.g. SSL_KEY_BASE64) — the stock private-key rule only sees the plain PEM header"
regex = '''LS0tLS1CRUdJTiB(?:QUklWQVRFIEtFWS|SU0EgUFJJVkFURSBLRVkt|FQyBQUklWQVRFIEtFWS|EU0EgUFJJVkFURSBLRVkt|PUEVOU1NIIFBSSVZBVEUgS0VZ|FTkNSWVBURUQgUFJJVkFURSBLRVkt)[A-Za-z0-9+/]{64,}'''
keywords = ["ls0tls1crudjtib"]

# Wi-Fi: openvolley once shipped the LedBox AP passphrase inside a WIFI: QR
# payload. Field order in that format is free (S/T/P), so do not anchor on T.
# Values may contain spaces and backslash-escaped ; , : \ " (the QR escaping).
[[rules]]
id = "wifi-wpa-passphrase"
description = "WIFI: QR payload embedding a WPA passphrase (openvolley shipped one as a PNG)"
regex = '''WIFI:(?:(?:\\.|[^;\\\n])*;)*?P:((?:\\.|[^;\\"'\n]){8,63});'''
secretGroup = 1
keywords = ["wifi:"]
allowlists = [
  { regexes = ['''(?i)(<[^>]*>?|\{[^}]*\}?|\$|xxx+|your|example|placeholder|changeme|redacted|^pass(word|phrase)?$)'''] },
]

[[rules]]
id = "wifi-config-psk"
description = "hostapd wpa_passphrase= / wpa_psk= (raw hex PSK) / wpa_supplicant or NetworkManager psk= with a literal value"
regex = '''(?im)^[ \t]*(?:wpa_passphrase|wpa_psk|psk)[ \t]*=[ \t]*"?([^"\s#]{8,64})"?'''
secretGroup = 1
keywords = ["wpa_passphrase", "wpa_psk", "psk"]
allowlists = [
  { regexes = ['''(?i)(<[^>]*>?|\{[^}]*\}?|\$|xxx+|your|example|placeholder|changeme|redacted|^pass(word|phrase)?$)'''] },
]

# The form that actually leaked the second AP passphrase: printed hall-guide
# prose "<SSID> / <passphrase>" or "<SSID> · <passphrase>", no key=value at all.
# The slash needs spaces around it so file paths (ledbox_api/handlers.py) and
# URLs do not match; the ssid branch cannot cross a slash for the same reason.
[[rules]]
id = "wifi-ssid-passphrase-prose"
description = "Wi-Fi SSID followed by its passphrase in prose/HTML (\"ledbox_XXXX / passphrase\", \"SSID: net · passphrase\")"
regex = '''(?i)(?:\bledbox_[A-Za-z0-9]+|\bssid\b[^\n/]{0,40}?)(?:[ \t]+/[ \t]+|[ \t]*(?:·|&middot;|&#183;|&#xb7;)[ \t]*)(?:<[^>\n]{1,20}>[ \t]*)*([^\s<"'/]{8,63})'''
secretGroup = 1
keywords = ["ledbox_", "ssid"]
allowlists = [
  { regexes = ['''(?i)(<[^>]*>?|&lt;|\{[^}]*\}?|\$|xxx+|your|example|placeholder|changeme|redacted|\.\.\.|\*\*\*)'''] },
  # Column headers such as "SSID / Passwort".
  { regexes = ['''(?i)^(?:pass(?:word|wort|phrase)?|kennwort|schl(?:ü|ue)ssel|key|psk)\W*$'''] },
]

[[rules]]
id = "wifi-passphrase-label"
description = "Prose label \"WLAN-Passwort: …\" / \"Wi-Fi password: …\" followed by a literal"
regex = '''(?i)\b(?:wlan|wi-?fi)[- _]?(?:passwort|password|passphrase|kennwort|schl(?:ü|ue)ssel|key|pw|pass)\b[^\n:=]{0,10}[:=][ \t]*(?:<[^>\n]{1,20}>[ \t]*)*["']?([^\s<"']{8,63})'''
secretGroup = 1
keywords = ["wlan", "wifi", "wi-fi"]
allowlists = [
  { regexes = ['''(?i)(<[^>]*>?|&lt;|\{[^}]*\}?|\$|xxx+|your|example|placeholder|changeme|redacted|\.\.\.|\*\*\*)'''] },
  # Code, not a literal: wifiPassword: cfg.pass, / wifi_key = getKey().
  { regexes = [
    '''^[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*[,;]$''',
    '''^[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*\(''',
    '''(?i)^(?:process\.|import\.meta|env\.|os\.environ|getenv|config\.)''',
  ] },
]

[[rules]]
id = "generic-credential-assignment"
description = "Broad sweep: SECRET/PASSWORD/PASSPHRASE/TOKEN/APIKEY assigned a literal. Noisy by design — this is an inventory rule, expect false positives."
# The value is group 1; the name is non-capturing so allowlists and entropy see the value, not the variable name.
regex = '''(?i)\b[a-z_]*(?:secret|password|passwd|passphrase|_pass|_pwd|api[_-]?key|auth[_-]?token|access[_-]?token)\b["'\s]*[:=]["'\s]*["']([^"'\s$<{]{8,})["']'''
secretGroup = 1
keywords = ["secret", "password", "passwd", "passphrase", "_pass", "_pwd", "apikey", "api_key", "api-key", "auth_token", "authtoken", "access_token", "accesstoken"]
allowlists = [
  # Placeholders. Matched against the value only (not the whole line), so a
  # real secret assigned to e.g. test_api_key is still reported.
  { regexes = ['''(?i)(your[_\- ]|example|placeholder|dummy|xxx+|change[_\- ]?me|replace[_\- ]?me|redacted|_here$|\.\.\.|\*\*\*|<[^>]+>|\$\{?[A-Z_]+\}?)'''] },
  # A snake/kebab-case identifier is a key name or enum, not a secret:
  # access_token="access_token". A single word is NOT allowed (vendor firmware
  # once hard-coded the board's sudo password as one lowercase word).
  { regexes = ['''^[a-z]+(?:[_\-.][a-z]+)+$'''] },
  # i18n labels: "password": "Passwort".
  { regexes = ['''(?i)^(?:password|passwort|passphrase|kennwort|secret|token|api[_ -]?key)$'''] },
  { regexTarget = "match", regexes = ['''(?i)(process\.env|import\.meta\.env|secrets\.)'''] },
  # Test fixtures (password: 'pw…' in backend/tests/auth.test.js) are fake by
  # construction. Only this broad sweep skips them; every specific rule above
  # (service_role JWT, sb_secret_, Resend, psk, …) still scans test files.
  { paths = ['''(^|/)(?:tests?|__tests__|spec)/''', '''\.(?:test|spec)\.[cm]?[jt]sx?$'''] },
]

# Personal data from matches. App backups, logs, diagnostics and exports hold
# players' and officials' names, dates of birth and signatures; a contact list
# holds names, phone numbers and email addresses. Unlike a key, personal data
# cannot be rotated once it is public, so it must never be committed.
# .gitignore keeps these files out of `git add`; the rules below catch them
# when added anyway (git add -f, another name, pasted into a data file). They
# read data files only (JSON, JSONL, HAR, logs, CSV), as the apps and browsers
# write them, and skip the test fixture folders (tests/fixtures,
# __tests__/fixtures, __fixtures__): test data uses fictional people. Any other
# folder named like "fixtures" (a league's match schedule) is scanned. Binary
# files (xlsx, PDF) are left to .gitignore.
[[rules]]
id = "match-data-birth-date"
description = "Personal data: a date of birth in JSON, as in app backups, logs, roster exports and API dumps"
# Any key holding dob or birth (dob, referee_1_dob, referee1Dob, birthDate,
# formattedAndTimezoneIndependentBirthday) with a date-shaped value, also a
# timestamp (2008-02-01T00:00:00.000Z), with or without a name next to it.
# Quotes may be escaped (JSON inside a log line). The date is the secret, so
# --redact hides it.
regex = '''(?i)\\?"[\w-]*(?:dob|birth)[\w-]*\\?"\s*:\s*\\?"(\d{1,2}[./-]\d{1,2}[./-](?:19|20)\d{2}|(?:19|20)\d{2}-\d{1,2}-\d{1,2})'''
secretGroup = 1
path = '''(?i)\.(?:json|jsonl|ndjson|har|txt|log|csv|tsv)$'''
keywords = ["dob", "birth"]
allowlists = [
  { paths = ['''(?:^|/)(?:tests/fixtures|__tests__/fixtures|__fixtures__)/'''] },
]

[[rules]]
id = "match-data-signature"
description = "Personal data: a signature (or photo) as a base64 data:image value in JSON"
# A tiny inline icon is not a signature: at least 200 base64 characters (~150 bytes).
regex = '''(?i)\\?"[\w.-]{1,64}\\?"\s*:\s*\\?"(data:image/[a-z0-9.+-]{2,20};base64,[a-z0-9+/]{32})[a-z0-9+/]{168,}'''
secretGroup = 1
path = '''(?i)\.(?:json|jsonl|ndjson|har|txt|log|csv|tsv)$'''
keywords = ["data:image"]
allowlists = [
  { paths = ['''(?:^|/)(?:tests/fixtures|__tests__/fixtures|__fixtures__)/'''] },
]

[[rules]]
id = "match-data-contact"
description = "Personal data: a person (name) with a phone number in JSON, as in contact lists"
regex = '''(?i)\\?"(?:first_?name|last_?name|surname|full_?name|name)\\?"\s*:\s*\\?"[^"\\]{2,}\\?"[^{}]{0,300}?\\?"(?:[\w-]*(?:phone|mobile|natel|handy|telefon)[\w-]*|tel)\\?"\s*:\s*\\?"(\+?\d[\d ./()-]{6,}\d)|\\?"(?:[\w-]*(?:phone|mobile|natel|handy|telefon)[\w-]*|tel)\\?"\s*:\s*\\?"(\+?\d[\d ./()-]{6,}\d)\\?"[^{}]{0,300}?\\?"(?:first_?name|last_?name|surname|full_?name|name)\\?"\s*:\s*\\?"[^"\\]{2,}'''
path = '''(?i)\.(?:json|jsonl|ndjson|har|txt|log|csv|tsv)$'''
keywords = ["phone", "mobile", "natel", "handy", "tel"]
allowlists = [
  { paths = ['''(?:^|/)(?:tests/fixtures|__tests__/fixtures|__fixtures__)/'''] },
]

[[rules]]
id = "match-data-email"
description = "Personal data: a person (name) with an email address in JSON, as in contact lists"
# Same shape as match-data-contact. The address is the secret; placeholder
# domains (example.com/org/net, .test, .invalid, .local) are not a person's.
regex = '''(?i)\\?"(?:first_?name|last_?name|surname|full_?name|name)\\?"\s*:\s*\\?"[^"\\]{2,}\\?"[^{}]{0,300}?\\?"[\w-]*e-?mail[\w-]*\\?"\s*:\s*\\?"([^"\\\s@]+@[\w-]+(?:\.[\w-]+)+)|\\?"[\w-]*e-?mail[\w-]*\\?"\s*:\s*\\?"([^"\\\s@]+@[\w-]+(?:\.[\w-]+)+)\\?"[^{}]{0,300}?\\?"(?:first_?name|last_?name|surname|full_?name|name)\\?"\s*:\s*\\?"[^"\\]{2,}'''
path = '''(?i)\.(?:json|jsonl|ndjson|har|txt|log|csv|tsv)$'''
keywords = ["mail"]
allowlists = [
  { regexes = ['''(?i)@(?:[\w-]+\.)*(?:example\.(?:com|org|net)|[\w-]+\.(?:test|invalid|local))$'''] },
  { paths = ['''(?:^|/)(?:tests/fixtures|__tests__/fixtures|__fixtures__)/'''] },
]

# An encrypted match backup (backupCrypto/envelope.js) under any file name: it
# holds the whole match, roster included. JSON files only: the format name
# also appears in the code and docs.
[[rules]]
id = "match-data-encrypted-backup"
description = "Personal data: an encrypted match backup (openvolley-encrypted-backup envelope)"
regex = '''"format"\s*:\s*"openvolley-encrypted-backup"'''
path = '''(?i)\.json$'''
keywords = ["openvolley-encrypted-backup"]
allowlists = [
  { paths = ['''(?:^|/)(?:tests/fixtures|__tests__/fixtures|__fixtures__)/'''] },
]

# Path only: the names the apps give their backups, logs, diagnostics and
# exports (the same list as .gitignore), including the native backup folders'
# latest.json. Catches a backup whose content no other rule reads.
[[rules]]
id = "match-data-file"
description = "Personal data: an app backup, log, diagnostics or match export file (by its name)"
path = '''(?i)(?:^|/)(?:debug_logs/|backup_g\d+_set\d+[^/]*\.json$|backup_set\d+_[^/]*\.json$|\d{8}T\d{6}\.\d{3}Z-\d+\.json$|(?:test-)?(?:game\d+|match-)[^/]*/latest\.json$|[0-9a-f]{8}-latest\.json$|[^/]*-manual-\d{8}T\d{6}Z\.json$|logs_[^/]*\.txt$|diagnostic_log[^/]*\.(?:json|ndjson)$|openvolley-diagnostics(?:-[^/]*)?\.(?:txt|jsonl)$|openvolley-activity(?:-[^/]*)?\.(?:json|ndjson|csv)$|(?:activity|diagnostics)-\d{4}-\d{2}-\d{2}\.jsonl$|MatchData_[^/]*\.json$|match-data-[^/]*\.json$|match_stopped_[^/]*\.json$|database_export_[^/]*\.json$)'''
allowlists = [
  { paths = ['''(?:^|/)(?:tests/fixtures|__tests__/fixtures|__fixtures__)/'''] },
]

# The anon key is meant to be public (see supabase-service-role-jwt above), so
# the stock "jwt" rule would otherwise flag every bundle that embeds it.
[[allowlists]]
description = "Supabase anon JWT is publishable"
targetRules = ["jwt"]
regexTarget = "match"
regexes = ['''^eyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]*(?:InJvbGUiOiJhbm9u|Jyb2xlIjoiYW5v|icm9sZSI6ImFub24i)''']

# openvolley identifiers the stock generic-api-key rule mistakes for keys:
# seed_key is a match id (match_<ts>_<rand>), fetchWithAuth is a minified fn.
[[allowlists]]
description = "openvolley identifiers that look like keys"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(?i)seed_?key["'\s]*[:=]''', '''fetchWithAuth\s*=''']

# F-Droid recipe: AllowedAPKSigningKeys is the SHA-256 of the app's public
# signing certificate (printed by apksigner verify --print-certs), not a secret.
[[allowlists]]
description = "F-Droid AllowedAPKSigningKeys (public certificate fingerprint)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''^AllowedAPKSigningKeys:\s*[0-9a-f]{64}$''']

# Lockfiles, vendored deps and build output are noise, not history worth purging.
# ([[allowlists]] form: gitleaks refuses the legacy [allowlist] table next to it.)
[[allowlists]]
description = "Lockfiles, vendored deps, build output"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)vendor/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''package-lock\.json$''',
  '''pnpm-lock\.yaml$''',
  '''composer\.lock$''',
  '''Cargo\.lock$''',
  '''uv\.lock$''',
]
