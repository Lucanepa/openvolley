# Update proposals as pull requests, reviewed like any other change: the npm
# lock files of the backend, the frontend and the render service, the Docker
# base images, the desktop app's Cargo.lock, the Android build (Gradle) and the
# commit pins of the workflows' actions.
# Security updates come as soon as an advisory is published; the rest weekly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /escoresheet/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /escoresheet/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]

  # The render service (escoresheet/render): its playwright-core pins the
  # Chromium that prints the official PDF; a bump needs a new render image.
  - package-ecosystem: npm
    directory: /escoresheet/render
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # The base images of the backend and render images (Node) and of compose.
  - package-ecosystem: docker
    directory: /escoresheet/deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /escoresheet/frontend/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /escoresheet/frontend/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # No Gradle 9 or AGP 9 while the app is on Capacitor 8 (ANDROID.md, "Gradle
    # and AGP stay on 8.x"): Capacitor 8 and its plugins build with AGP 8.13,
    # which fails on Gradle 9.6 and later (Gradle removed an internal API that
    # AGP 8 uses), and AGP 9 needs the Capacitor 9 plugins. Gradle 8.14.x still
    # gets security releases. Drop this with the move to Capacitor 9.
    ignore:
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major]
      - dependency-name: com.android.tools.build:gradle
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
