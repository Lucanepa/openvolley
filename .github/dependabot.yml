# Update proposals as pull requests, reviewed like any other change: the npm
# lock files of the backend and the frontend, the desktop app's Cargo.lock,
# the Android build (Gradle) and the commit pins of the workflows' actions.
# Security updates come as soon as an advisory is published; the rest weekly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /escoresheet/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /escoresheet/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /escoresheet/frontend/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /escoresheet/frontend/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
