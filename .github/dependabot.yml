# Update proposals as pull requests, reviewed like any other change: the npm
# lock files of the backend, the frontend and the render service, the Docker
# base images, the desktop app's Cargo.lock, the Android build (Gradle) and the
# commit pins of the workflows' actions.
# Security updates come as soon as an advisory is published; the rest weekly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /escoresheet/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /escoresheet/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]

  # The render service (escoresheet/render): its playwright-core pins the
  # Chromium that prints the official PDF; a bump needs a new render image.
  - package-ecosystem: npm
    directory: /escoresheet/render
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # The base images of the backend and render images (Node) and of compose.
  - package-ecosystem: docker
    directory: /escoresheet/deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /escoresheet/frontend/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # zbus stays on 5 while tauri-plugin-single-instance needs zbus ^5.9 on
      # Linux (2.5.5 and 3.0.0-alpha.3, 20.11.2026): zbus 6 would add a second
      # zbus beside it and keep zbus_names 4 / zvariant 5 (the unmaintained
      # warnings of cargo audit) in the tree. Remove this when the plugin moves
      # to zbus 6, then port netshare/linux.rs, lifecycle.rs and main.rs (#155).
      - dependency-name: zbus
        update-types: ['version-update:semver-major']

  - package-ecosystem: gradle
    directory: /escoresheet/frontend/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
