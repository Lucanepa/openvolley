name: Backend tests

# Runs the backend node:test suites, including the Postgres suites
# (pgQuery, matchRestore, least-privilege role) against a throwaway Postgres.
on:
  push:
    branches: [main]
    paths:
      - 'escoresheet/backend/**'
      # frontend files the backend tests compare the server's copy with: the
      # activity-log sanitizer, the match roster rules, the phone-signing
      # vectors and HTTP scenario, the help sections and the brand mark
      - 'escoresheet/frontend/src/domain/activitySummary.js'
      - 'escoresheet/frontend/src/domain/uploadedRoster.js'
      - 'escoresheet/frontend/electron/__fixtures__/**'
      - 'escoresheet/frontend/src/components/help/helpSections.js'
      - 'escoresheet/frontend/brand/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'escoresheet/backend/**'
      # (the same paths as for push)
      - 'escoresheet/frontend/src/domain/activitySummary.js'
      - 'escoresheet/frontend/src/domain/uploadedRoster.js'
      - 'escoresheet/frontend/electron/__fixtures__/**'
      - 'escoresheet/frontend/src/components/help/helpSections.js'
      - 'escoresheet/frontend/brand/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: escoresheet/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: escoresheet/backend
        run: npm ci

      - name: Run tests
        working-directory: escoresheet/backend
        run: npm test
