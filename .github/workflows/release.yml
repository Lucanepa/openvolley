name: Build and Release Server

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.3.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            echo "Unexpected trigger — skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Will release: $VERSION"

  # --- Build indoor frontend assets (parallel) ---
  build-indoor-frontend:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install indoor frontend dependencies
        working-directory: escoresheet/frontend
        run: npm ci

      - name: Remove canvas native dependency
        working-directory: escoresheet/frontend
        run: |
          if [ -d "node_modules/canvas" ]; then
            rm -rf node_modules/canvas
          fi

      - name: Build indoor frontend (referee, bench, roster)
        working-directory: escoresheet/frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          node scripts/build-subdomains.js referee
          node scripts/build-subdomains.js bench
          node scripts/build-subdomains.js roster

      - name: Upload indoor frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indoor-frontend
          path: |
            escoresheet/frontend/dist-referee/
            escoresheet/frontend/dist-bench/
            escoresheet/frontend/dist-roster/
          retention-days: 1

  # --- Build beach frontend assets (parallel) ---
  build-beach-frontend:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone openbeach repository
        uses: actions/checkout@v4
        with:
          repository: Lucanepa/openbeach

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install beach frontend dependencies
        working-directory: escoresheet/frontend
        run: npm ci

      - name: Remove canvas native dependency
        working-directory: escoresheet/frontend
        run: |
          if [ -d "node_modules/canvas" ]; then
            rm -rf node_modules/canvas
          fi

      - name: Build beach frontend (referee + scoreboard)
        working-directory: escoresheet/frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          node scripts/build-subdomains.js beach-referee
          node scripts/build-subdomains.js beach-scoreboard

      - name: Upload beach frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beach-frontend
          path: |
            escoresheet/frontend/dist-beach-referee/
            escoresheet/frontend/dist-beach-scoreboard/
          retention-days: 1

  # --- Assemble all frontend assets into server public directory ---
  assemble-server-public:
    needs: [check-version, build-indoor-frontend, build-beach-frontend]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download indoor frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: indoor-frontend
          path: indoor/

      - name: Download beach frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: beach-frontend
          path: beach/

      - name: Debug artifact structure
        run: |
          echo "Indoor artifact structure:"
          find indoor/ -type f | head -20
          echo "Beach artifact structure:"
          find beach/ -type f | head -20

      - name: Assemble server public directory
        run: |
          mkdir -p public/referee public/bench public/roster
          mkdir -p public/beach-referee public/beach-scoreboard

          cp -r indoor/dist-referee/* public/referee/
          cp -r indoor/dist-bench/* public/bench/
          cp -r indoor/dist-roster/* public/roster/
          cp -r beach/dist-beach-referee/* public/beach-referee/
          cp -r beach/dist-beach-scoreboard/* public/beach-scoreboard/

          echo "Assembled public directory:"
          du -sh public/*/

      - name: Upload server public files
        uses: actions/upload-artifact@v4
        with:
          name: server-public
          path: public/
          retention-days: 1

  # --- Standalone Server Binaries (Node.js SEA) ---
  build-server-linux:
    needs: [check-version, assemble-server-public]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: escoresheet/backend
        run: npm ci

      - name: Download server public files
        uses: actions/download-artifact@v4
        with:
          name: server-public
          path: escoresheet/backend/public/

      - name: Build SEA binary (Linux x64)
        working-directory: escoresheet/backend
        run: node build-server.js --output openvolley-server-linux-x64

      - name: Upload Linux server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: escoresheet/backend/dist/openvolley-server-linux-x64
          retention-days: 30

  build-server-windows:
    needs: [check-version, assemble-server-public]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: escoresheet/backend
        run: npm ci

      - name: Download server public files
        uses: actions/download-artifact@v4
        with:
          name: server-public
          path: escoresheet/backend/public/

      - name: Build SEA binary (Windows x64)
        working-directory: escoresheet/backend
        run: node build-server.js --output openvolley-server-win-x64.exe

      - name: Upload Windows server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-windows
          path: escoresheet/backend/dist/openvolley-server-win-x64.exe
          retention-days: 30

  build-server-macos:
    needs: [check-version, assemble-server-public]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: escoresheet/backend
        run: npm ci

      - name: Download server public files
        uses: actions/download-artifact@v4
        with:
          name: server-public
          path: escoresheet/backend/public/

      - name: Build SEA binary (macOS arm64)
        working-directory: escoresheet/backend
        run: node build-server.js --output openvolley-server-macos-arm64

      - name: Upload macOS server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-macos
          path: escoresheet/backend/dist/openvolley-server-macos-arm64
          retention-days: 30

  release:
    needs: [check-version, build-server-linux, build-server-windows, build-server-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "Artifact structure:"
          find artifacts -type f | head -30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: OpenVolley Server ${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Standalone Server (Indoor + Beach Volleyball)

            Double-click to start the server. Open `http://localhost:8080` in a browser to see QR codes for connecting devices. Each device can install the app as a **PWA** from the browser menu for a native-like experience.

            All devices must be on the same network.

            ### Indoor Volleyball
            - **Referee**: `/referee`
            - **Team Bench**: `/bench`
            - **Roster Upload**: `/roster`

            ### Beach Volleyball
            - **Referee**: `/beach-referee`
            - **Scoreboard**: `/beach-scoreboard`

            ### Downloads
            - **Windows**: `openvolley-server-win-x64.exe`
            - **macOS (Apple Silicon)**: `openvolley-server-macos-arm64`
            - **Linux**: `openvolley-server-linux-x64`
          files: |
            artifacts/server-linux/*
            artifacts/server-windows/*
            artifacts/server-macos/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old releases (keep last 3)
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
