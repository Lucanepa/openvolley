name: Build and Release Desktop Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.3.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            echo "Unexpected trigger — skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Will release: $VERSION"

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install dependencies
        working-directory: escoresheet/frontend
        run: npm ci

      - name: Remove canvas native dependency
        working-directory: escoresheet/frontend
        run: |
          if (Test-Path "node_modules\canvas") {
            Remove-Item -Recurse -Force "node_modules\canvas"
          }

      - name: Build Electron app (Windows)
        working-directory: escoresheet/frontend
        env:
          ELECTRON: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build:win -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            escoresheet/frontend/dist-electron/*.exe
            escoresheet/frontend/dist-electron/*.exe.blockmap
          retention-days: 30

  build-macos:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install dependencies
        working-directory: escoresheet/frontend
        run: npm ci

      - name: Remove canvas native dependency
        working-directory: escoresheet/frontend
        run: |
          if [ -d "node_modules/canvas" ]; then
            rm -rf node_modules/canvas
          fi

      - name: Build Electron app (macOS)
        working-directory: escoresheet/frontend
        env:
          ELECTRON: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run electron:build:mac -- --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            escoresheet/frontend/dist-electron/*.dmg
            escoresheet/frontend/dist-electron/*.dmg.blockmap
            escoresheet/frontend/dist-electron/*.zip
          retention-days: 30

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install dependencies
        working-directory: escoresheet/frontend
        run: npm ci

      - name: Remove canvas native dependency
        working-directory: escoresheet/frontend
        run: |
          if [ -d "node_modules/canvas" ]; then
            rm -rf node_modules/canvas
          fi

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Electron app (Linux)
        working-directory: escoresheet/frontend
        env:
          ELECTRON: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build:linux -- --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            escoresheet/frontend/dist-electron/*.AppImage
            escoresheet/frontend/dist-electron/*.deb
            escoresheet/frontend/dist-electron/*.rpm
          retention-days: 30

  release:
    needs: [check-version, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "Artifact structure:"
          find artifacts -type f -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Openvolley eScoresheet ${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Downloads

            ### Windows
            - **Installer**: `Openvolley eScoresheet Setup X.X.X.exe` - Recommended for most users
            - **Portable**: `Openvolley eScoresheet X.X.X.exe` - No installation required

            ### macOS
            - **DMG**: `Openvolley eScoresheet-X.X.X.dmg` - Drag to Applications
            - **ZIP**: `Openvolley eScoresheet-X.X.X-mac.zip` - Extract and run

            ### Linux
            - **AppImage**: `Openvolley eScoresheet-X.X.X.AppImage` - Make executable and run
            - **DEB**: For Debian/Ubuntu
            - **RPM**: For Fedora/RHEL
          files: |
            artifacts/**/*.exe
            artifacts/**/*.exe.blockmap
            artifacts/**/*.dmg
            artifacts/**/*.dmg.blockmap
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old releases (keep last 3)
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
