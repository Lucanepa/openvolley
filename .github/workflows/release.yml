name: Build and Release Server

# The standalone server binaries (Node.js SEA) with the indoor and beach pages.
# A v* tag push builds and publishes them as a GitHub release; a manual run
# only builds (workflow artifacts), it never creates or edits a release. A
# published release is never replaced: a run again on its tag only adds the
# binaries it lacks. The beach pages come from the Lucanepa/openbeach commit
# in .github/openbeach-commit, named in the release notes.
# Third-party actions are pinned by commit (version in the comment; Dependabot
# proposes updates, .github/dependabot.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.3.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

# Every job reads only; the release job asks for contents: write.
permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      openbeach_commit: ${{ steps.openbeach.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Determine version
        id: check
        # Both values reach the shell through env, never through ${{ }}
        # interpolation into the script text: GitHub substitutes expressions
        # before bash parses the line, so a tag or input named `v1$(id)`
        # would otherwise execute. Git permits `$`, `(` and `)` in tag names.
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            VERSION="$REF_NAME"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            echo "Unexpected trigger — skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Constrain to a tag shape before it is written to an output that
          # later steps interpolate into release names and tag_name.
          if [[ ! "$VERSION" =~ ^v?[0-9A-Za-z._-]{1,64}$ ]]; then
            echo "::error::Refusing unsafe version string"
            exit 1
          fi
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Will release: $VERSION"

      - name: Read the pinned OpenBeach commit
        id: openbeach
        run: |
          commit=$(grep -v '^#' .github/openbeach-commit | tr -d '[:space:]')
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/openbeach-commit holds no full commit id"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "OpenBeach pages from Lucanepa/openbeach $commit"

  # --- Build indoor frontend assets (parallel) ---
  build-indoor-frontend:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install indoor frontend dependencies
        working-directory: escoresheet/frontend
        run: npm ci

      - name: Remove canvas native dependency
        working-directory: escoresheet/frontend
        run: |
          if [ -d "node_modules/canvas" ]; then
            rm -rf node_modules/canvas
          fi

      - name: Build indoor frontend (referee, bench, roster)
        working-directory: escoresheet/frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          node scripts/build-subdomains.js referee --base /referee/
          node scripts/build-subdomains.js bench --base /bench/
          node scripts/build-subdomains.js roster --base /roster/

      - name: Upload indoor frontend artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: indoor-frontend
          path: |
            escoresheet/frontend/dist-referee/
            escoresheet/frontend/dist-bench/
            escoresheet/frontend/dist-roster/
          retention-days: 1

  # --- Build beach frontend assets (parallel) ---
  build-beach-frontend:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone openbeach repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Lucanepa/openbeach
          ref: ${{ needs.check-version.outputs.openbeach_commit }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install beach frontend dependencies
        working-directory: escoresheet/frontend
        run: npm ci

      - name: Remove canvas native dependency
        working-directory: escoresheet/frontend
        run: |
          if [ -d "node_modules/canvas" ]; then
            rm -rf node_modules/canvas
          fi

      - name: Build beach frontend (referee + scoreboard)
        working-directory: escoresheet/frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          node scripts/build-subdomains.js beach-referee --base /beach-referee/
          node scripts/build-subdomains.js beach-scoreboard --base /beach-scoreboard/

      - name: Upload beach frontend artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beach-frontend
          path: |
            escoresheet/frontend/dist-beach-referee/
            escoresheet/frontend/dist-beach-scoreboard/
          retention-days: 1

  # --- Assemble all frontend assets into server public directory ---
  assemble-server-public:
    needs: [check-version, build-indoor-frontend, build-beach-frontend]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download indoor frontend artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: indoor-frontend
          path: indoor/

      - name: Download beach frontend artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beach-frontend
          path: beach/

      - name: Debug artifact structure
        run: |
          echo "Indoor artifact structure:"
          find indoor/ -type f | head -20
          echo "Beach artifact structure:"
          find beach/ -type f | head -20

      - name: Assemble server public directory
        run: |
          mkdir -p public/referee public/bench public/roster
          mkdir -p public/beach-referee public/beach-scoreboard

          cp -r indoor/dist-referee/* public/referee/
          cp -r indoor/dist-bench/* public/bench/
          cp -r indoor/dist-roster/* public/roster/
          cp -r beach/dist-beach-referee/* public/beach-referee/
          cp -r beach/dist-beach-scoreboard/* public/beach-scoreboard/

          echo "Assembled public directory:"
          du -sh public/*/

      - name: Upload server public files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-public
          path: public/
          retention-days: 1

  # --- Standalone Server Binaries (Node.js SEA) ---
  build-server-linux:
    needs: [check-version, assemble-server-public]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: escoresheet/backend
        run: npm ci

      - name: Download server public files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server-public
          path: escoresheet/backend/public/

      - name: Build SEA binary (Linux x64)
        working-directory: escoresheet/backend
        run: |
          node build-server.js --output openvolley-server-linux-x64
          chmod +x dist/openvolley-server-linux-x64

      - name: Upload Linux server binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-linux
          path: escoresheet/backend/dist/openvolley-server-linux-x64
          retention-days: 30

  build-server-windows:
    needs: [check-version, assemble-server-public]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: escoresheet/backend
        run: npm ci

      - name: Download server public files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server-public
          path: escoresheet/backend/public/

      - name: Build SEA binary (Windows x64)
        working-directory: escoresheet/backend
        run: node build-server.js --output openvolley-server-win-x64.exe

      - name: Upload Windows server binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-windows
          path: escoresheet/backend/dist/openvolley-server-win-x64.exe
          retention-days: 30

  build-server-macos:
    needs: [check-version, assemble-server-public]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: escoresheet/backend
        run: npm ci

      - name: Download server public files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server-public
          path: escoresheet/backend/public/

      - name: Build SEA binary (macOS arm64)
        working-directory: escoresheet/backend
        run: |
          node build-server.js --output openvolley-server-macos-arm64
          chmod +x dist/openvolley-server-macos-arm64

      - name: Upload macOS server binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-macos
          path: escoresheet/backend/dist/openvolley-server-macos-arm64
          retention-days: 30

  release:
    needs: [check-version, build-server-linux, build-server-windows, build-server-macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # release-files.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts/release-files.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect the binaries
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          .github/scripts/release-files.sh "$VERSION" upload notes-sha256.md \
            artifacts/server-linux/* artifacts/server-windows/* artifacts/server-macos/*

      - name: Write the release notes
        if: steps.files.outputs.exists == 'false'
        env:
          OPENBEACH_COMMIT: ${{ needs.check-version.outputs.openbeach_commit }}
        run: |
          cat > notes.md <<'NOTES'
          ## Standalone Server (Indoor + Beach Volleyball)

          A single binary with all frontend assets embedded — no extra files needed.

          ### Quick Start
          1. Download the binary for your platform
          2. Run it:
             - **Windows**: Double-click `openvolley-server-win-x64.exe`
             - **macOS / Linux**: Open a terminal in your Downloads folder:
               ```
               cd ~/Downloads
               chmod +x openvolley-server-*
               ./openvolley-server-*
               ```

          Open the URL shown in the console. Scan QR codes with your phone to connect each role. All devices must be on the **same Wi-Fi network**.

          ### Indoor Volleyball
          - **Referee** · **Team Bench** · **Roster Upload**

          ### Beach Volleyball
          - **Referee** · **Scoreboard**
          NOTES
          printf '\nBeach pages built from Lucanepa/openbeach at `%s`.\n' "$OPENBEACH_COMMIT" >> notes.md
          cat notes-sha256.md >> notes.md

      - name: Create Release
        if: steps.files.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: OpenVolley Server ${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          # Never "Latest": the desktop updater's fallback endpoint is
          # releases/latest/download/latest.json, so that must stay the newest
          # desktop-v* release (escoresheet/deploy/README.md, Public downloads).
          make_latest: "false"
          body_path: notes.md
          files: upload/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the binaries the release lacks
        if: steps.files.outputs.exists == 'true' && steps.files.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: gh release upload "$VERSION" upload/*

      - name: Delete old server releases (keep last 3)
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
          # Only server releases (v1.2.3); never touch desktop-v* releases,
          # whose assets the app's main page links directly.
          delete_tag_pattern: '^v[0-9]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
