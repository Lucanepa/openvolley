name: Build iOS App (Capacitor)

# The scorer app (plus the referee, bench and livescore views) for iPad and
# iPhone: the frontend bundled into a Capacitor app (escoresheet/frontend/ios,
# IOS.md), like the Android app. Every run builds it for the simulator and
# starts it on an iPad simulator (screenshot and log uploaded).
# A manual run with "testflight" on main (or a tag) also ships the App Store
# build to TestFlight, in two jobs, as desktop.yml does for macOS:
#   - build: npm ci, vite, cap sync and xcodebuild, with no secret at all; it
#     archives the Release build UNSIGNED and uploads the archive;
#   - testflight: runs no npm and no third-party action and builds nothing;
#     it signs that archive with the Apple Distribution certificate and the
#     "OpenVolley App Store" profile (xcodebuild -exportArchive), checks the
#     result and uploads it to App Store Connect, where it shows in TestFlight
#     after Apple's processing. It is the only job with the secrets, which
#     live in the GitHub environment ios-signing (Settings › Environments:
#     deployment branch main and tags only; no repository secret of these
#     names): IOS_DIST_CERTIFICATE (.p12, base64), IOS_DIST_CERTIFICATE_PASSWORD,
#     IOS_PROVISIONING_PROFILE (.mobileprovision, base64) and the App Store
#     Connect API key APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_PRIVATE_KEY
#     (the same key as desktop.yml's macos-signing).
# Pull requests only build and smoke-test; they never sign or upload.
# Third-party actions are pinned by commit (version in the comment; Dependabot
# proposes updates, .github/dependabot.yml).
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also upload the App Store build to TestFlight (main or a tag only)'
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'escoresheet/frontend/ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build:
    # xcode-27 (macOS 27, GitHub preview image): the only image with Xcode 27
    # (iOS 27 SDK); macos-26 tops out at Xcode 26.x. App Store Connect requires
    # the iOS 27 SDK from April 2027 (ITMS-90725). Back to macos-27 once that
    # label is generally available.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: escoresheet/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # App Store Connect takes builds made with the current SDK only: the
      # newest stable Xcode on the image, not its default
      - name: Pick the newest Xcode
        run: |
          # resolve aliases first: Xcode_N.app can be a symlink to a beta install
          x=$(for a in /Applications/Xcode_*.app; do [ -e "$a" ] && readlink -f "$a"; done \
            | grep -viE 'beta|release_candidate|_rc' | sort -uV | tail -n1 || true)
          [ -z "$x" ] || sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci
          # native canvas is not needed in the bundle and can break installs
          if [ -d node_modules/canvas ]; then rm -rf node_modules/canvas; fi

      - name: Check the iOS project
        run: npx vitest run src/__tests__/iosApp.test.js

      # As scripts/release-android.sh: no service worker (CAPACITOR=true), the
      # cloud backend by default (a venue relay is chosen in Options)
      - name: Build the bundled web app
        env:
          CAPACITOR: 'true'
          VITE_BACKEND_URL: https://backend.openvolley.app
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          npx vite build --outDir dist-capacitor --emptyOutDir
          npx cap sync ios

      - name: Build for the simulator
        working-directory: escoresheet/frontend/ios/App
        run: |
          xcodebuild -quiet -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build

      # The newest iPad simulator: the app starts, shows its page and is still
      # running 25 s later
      - name: Start the app on an iPad simulator
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ios-smoke"; mkdir -p "$out"
          app="$RUNNER_TEMP/dd-sim/Build/Products/Debug-iphonesimulator/App.app"
          [ -d "$app" ] || { echo "::error::no $app"; exit 1; }
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("SimRuntime\\.iOS-"))
              | {v: (.key | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)") | [(.a | tonumber), (.b | tonumber)]), d: .value[]}
              | select(.d.name | test("^iPad"))]
            | sort_by(.v) | last | .d.udid // empty')
          [ -n "$udid" ] || { xcrun simctl list devices available; echo "::error::no iPad simulator"; exit 1; }
          xcrun simctl list devices available | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.openvolley.escoresheet
          sleep 25
          xcrun simctl io "$udid" screenshot "$out/ipad.png"
          xcrun simctl spawn "$udid" log show --last 3m --style compact --predicate 'process == "App"' > "$out/app.log" 2>&1 || true
          procs=$(xcrun simctl spawn "$udid" launchctl list)
          if ! grep -q 'com.openvolley.escoresheet' <<<"$procs"; then
            tail -n 80 "$out/app.log"; echo "::error::the app ended by itself"; exit 1
          fi
          grep -iE 'error|exception|fatal' "$out/app.log" | grep -v 'CoreData\|CFNetwork' | tail -n 20 || true
          xcrun simctl shutdown "$udid" || true

      - name: Upload the simulator smoke test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-smoke
          path: ${{ runner.temp }}/ios-smoke
          retention-days: 14
          if-no-files-found: ignore

      # The App Store build, archived without signing (main or a tag): the
      # testflight job signs it. Version = the frontend's (as the Android app
      # and the desktop app), build number = this workflow's run number
      # (always higher).
      - name: Archive the App Store build (unsigned)
        if: github.event_name == 'workflow_dispatch' && inputs.testflight && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        working-directory: escoresheet/frontend/ios/App
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          v=$(jq -r .version ../../package.json)
          echo "OpenVolley $v ($BUILD_NUMBER), unsigned"
          xcodebuild -quiet -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            -archivePath "$RUNNER_TEMP/OpenVolley.xcarchive" \
            MARKETING_VERSION="$v" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= archive
          # one file, symlinks and modes kept (frameworks)
          mkdir -p "$RUNNER_TEMP/ios-unsigned"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/ios-unsigned/OpenVolley.xcarchive.tar.gz" OpenVolley.xcarchive

      - name: Upload the unsigned archive
        if: github.event_name == 'workflow_dispatch' && inputs.testflight && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned-archive
          path: ${{ runner.temp }}/ios-unsigned/OpenVolley.xcarchive.tar.gz
          retention-days: 3
          if-no-files-found: error

  # Signs the build job's archive and uploads it to App Store Connect. Manual
  # runs with "testflight" on main or a tag only. It runs no npm and no
  # third-party action, starts nothing it signs, and is the only job with the
  # certificate and the App Store Connect key (environment ios-signing).
  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: xcode-27
    environment: ios-signing
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # ExportOptions.plist and the version of this ref; nothing of it is built or run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            escoresheet/frontend/ios/App/ExportOptions.plist
            escoresheet/frontend/package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Pick the newest Xcode
        run: |
          x=$(for a in /Applications/Xcode_*.app; do [ -e "$a" ] && readlink -f "$a"; done \
            | grep -viE 'beta|release_candidate|_rc' | sort -uV | tail -n1 || true)
          [ -z "$x" ] || sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version

      - name: Download the unsigned archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-unsigned-archive
          path: ${{ runner.temp }}/ios-unsigned

      # The Apple Distribution certificate in a keychain of its own: the
      # private key is not extractable (-x) and only codesign may use it
      # without a prompt; the keychain locks after 45 min (the job's limit).
      # The profile where Xcode looks for it; the API key where altool looks
      # (./private_keys of its working directory), mode 600 in RUNNER_TEMP.
      - name: Set up App Store signing
        env:
          IOS_DIST_CERTIFICATE: ${{ secrets.IOS_DIST_CERTIFICATE }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for v in IOS_DIST_CERTIFICATE IOS_DIST_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            [ -n "${!v}" ] || { echo "::error::secret $v is missing (environment ios-signing)"; exit 1; }
          done
          kc="$RUNNER_TEMP/ios-signing.keychain-db"
          echo "IOS_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          kcpw=$(openssl rand -base64 24)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 2700 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          p12="$RUNNER_TEMP/apple-distribution.p12"
          printf '%s' "$IOS_DIST_CERTIFICATE" | base64 --decode > "$p12"
          security import "$p12" -k "$kc" -P "$IOS_DIST_CERTIFICATE_PASSWORD" -x -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -q '"Apple Distribution: ' \
            || { security find-identity -v -p codesigning "$kc"; echo "::error::no Apple Distribution identity in the certificate"; exit 1; }
          prof="$RUNNER_TEMP/OpenVolley_App_Store.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$prof"
          security cms -D -i "$prof" > "$RUNNER_TEMP/profile.plist"
          name=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          [ "$name" = "OpenVolley App Store" ] || { echo "::error::profile '$name', expected 'OpenVolley App Store'"; exit 1; }
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$prof" "$d/$uuid.mobileprovision"
          done
          echo "IOS_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          asc="$RUNNER_TEMP/asc"
          mkdir -p "$asc/private_keys"
          chmod 700 "$asc" "$asc/private_keys"
          echo "IOS_ASC_DIR=$asc" >> "$GITHUB_ENV"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$asc/private_keys/AuthKey_$APPLE_API_KEY.p8"
          chmod 600 "$asc/private_keys/AuthKey_$APPLE_API_KEY.p8"

      # Signs with the identity and profile ExportOptions.plist names, then
      # checks the .ipa before anything leaves the runner: the version of
      # this ref and run, the Apple Distribution signature, the App Store
      # profile, the entitlements (no debugging) and a valid nested signature.
      - name: Sign and check the App Store build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/sign"; rm -rf "$w"; mkdir -p "$w"
          tar -xzf "$RUNNER_TEMP/ios-unsigned/OpenVolley.xcarchive.tar.gz" -C "$w"
          arc="$w/OpenVolley.xcarchive"
          v=$(jq -r .version escoresheet/frontend/package.json)
          info="$arc/Products/Applications/App.app/Info.plist"
          [ "$(plutil -extract CFBundleShortVersionString raw "$info")" = "$v" ] || { echo "::error::the archive is not version $v"; exit 1; }
          [ "$(plutil -extract CFBundleVersion raw "$info")" = "$BUILD_NUMBER" ] || { echo "::error::the archive is not build $BUILD_NUMBER of this run"; exit 1; }
          [ "$(plutil -extract CFBundleIdentifier raw "$info")" = com.openvolley.escoresheet ] || { echo "::error::not com.openvolley.escoresheet"; exit 1; }
          xcodebuild -exportArchive -archivePath "$arc" \
            -exportOptionsPlist escoresheet/frontend/ios/App/ExportOptions.plist -exportPath "$w/export"
          ipa=$(ls "$w"/export/*.ipa)
          mkdir -p "$w/check"
          ditto -x -k "$ipa" "$w/check"
          app="$w/check/Payload/App.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          sig=$(codesign -dvvv "$app" 2>&1)
          grep -q '^Authority=Apple Distribution: ' <<<"$sig" || { echo "$sig"; echo "::error::not signed with Apple Distribution"; exit 1; }
          ent=$(codesign -d --entitlements - --xml "$app" 2>/dev/null)
          grep -q 'T2Q99T2KH5\.com\.openvolley\.escoresheet' <<<"$ent" || { echo "$ent"; echo "::error::no application-identifier T2Q99T2KH5.com.openvolley.escoresheet"; exit 1; }
          ! grep -A1 'get-task-allow' <<<"$ent" | grep -q '<true/>' || { echo "::error::get-task-allow is on (a debug signature)"; exit 1; }
          security cms -D -i "$app/embedded.mobileprovision" > "$w/embedded.plist"
          [ "$(plutil -extract UUID raw "$w/embedded.plist")" = "$IOS_PROFILE_UUID" ] || { echo "::error::the .ipa does not embed the OpenVolley App Store profile"; exit 1; }
          echo "IOS_IPA=$ipa" >> "$GITHUB_ENV"
          echo "OpenVolley $v ($BUILD_NUMBER) signed: $ipa"

      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          cd "$IOS_ASC_DIR"
          export API_PRIVATE_KEYS_DIR="$IOS_ASC_DIR/private_keys"
          xcrun altool --validate-app -f "$IOS_IPA" -t ios --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          xcrun altool --upload-app -f "$IOS_IPA" -t ios --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          echo "::notice::uploaded: TestFlight shows it after Apple's processing"

      - name: Remove the signing keychain, profile and key
        if: always()
        run: |
          [ -z "${IOS_KEYCHAIN:-}" ] || security delete-keychain "$IOS_KEYCHAIN" || true
          [ -z "${IOS_ASC_DIR:-}" ] || rm -rf "$IOS_ASC_DIR"
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/sign" "$RUNNER_TEMP/OpenVolley_App_Store.mobileprovision" "$RUNNER_TEMP/profile.plist"
