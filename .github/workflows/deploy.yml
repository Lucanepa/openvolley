name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'escoresheet/frontend/**'
      - 'index.html'
      - 'landing.css'
      - 'landing.js'
      - 'ball.png'
      - 'favicon.ico'

# Cancel any in-progress deployments for the same branch
concurrency:
  group: pages-deployment
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      PAGES_CNAME: openvolley.app
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build subdomains
        working-directory: escoresheet/frontend
        run: |
          npm install
          export VITE_BASE_PATH="/"
          npm run build
          # Build all subdomains for Railway deployment
          node scripts/build-subdomains.js

      - name: Prepare landing page
        run: |
          mkdir -p landing-dist
          cp index.html landing.css landing.js ball.png favicon.ico landing-dist/ 2>/dev/null || true
          # Write CNAME for GitHub Pages
          echo "$PAGES_CNAME" > landing-dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit subdomain builds
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f escoresheet/frontend/dist-*/
          git diff --staged --quiet || git commit -m "Build subdomains"
          git push

