name: Build Desktop App (Tauri)

# Builds the offline scoretable desktop app (Rust/Tauri) for Windows + Linux.
# Trigger manually, or push a tag like `desktop-v1.20.0`.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: escoresheet/frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: escoresheet/frontend
        run: npm ci

      # Native canvas is not needed for the desktop bundle and can break installs.
      - name: Remove canvas native dependency
        working-directory: escoresheet/frontend
        shell: bash
        run: |
          if [ -d "node_modules/canvas" ]; then rm -rf node_modules/canvas; fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        # No VITE_BACKEND_URL on purpose: the desktop window is served by the
        # app's own LAN relay, and a fixed backend URL would send the scorer's
        # match relay to the cloud instead of to the venue tablets. Cloud sync
        # still works: cloud calls use their own base (backendConfig
        # getCloudApiUrl), backend.openvolley.app by default on a page served
        # by a local relay; set VITE_CLOUD_API_URL to point it elsewhere.
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        with:
          projectPath: escoresheet/frontend

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: escoresheet-desktop-${{ matrix.label }}
          path: |
            escoresheet/frontend/src-tauri/target/release/bundle/**/*.exe
            escoresheet/frontend/src-tauri/target/release/bundle/**/*.msi
            escoresheet/frontend/src-tauri/target/release/bundle/**/*.AppImage
            escoresheet/frontend/src-tauri/target/release/bundle/**/*.deb
          retention-days: 14
          if-no-files-found: warn

  # Publish the installers as a public GitHub Release so the app's main page
  # can link them directly (the home page looks up the newest desktop-v* release).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag is the version the updater announces (publish-pkgs.sh --desktop
      # signs the files for it), so it must be the version the app reports.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: escoresheet/frontend/package.json
          sparse-checkout-cone-mode: false

      - name: Check the tag matches the app version
        run: |
          tag=${GITHUB_REF_NAME#desktop-v}
          app=$(jq -r .version escoresheet/frontend/package.json)
          if [ "$tag" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME is version $tag, escoresheet/frontend/package.json says $app"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eScoresheet Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          # The desktop updater's fallback endpoint is
          # releases/latest/download/latest.json, so the newest desktop-v*
          # release must stay "Latest" (server v* releases set make_latest
          # "false" in release.yml and Android releases are created with
          # --latest=false for the same reason; publish-pkgs.sh --desktop takes
          # "Latest" back for the version latest.json announces).
          make_latest: "true"
          body: |
            ## Offline desktop scoretable + LAN tablet server

            Runs the volleyball e-scoresheet **fully offline** and doubles as a LAN
            server: referee / bench / livescore tablets on the same Wi-Fi connect to
            the addresses shown under the header menu → **Connect tablets** — no
            internet, no accounts. Online, matches also sync to the cloud.

            ### Install
            - **Windows**: download and run the `…x64-setup.exe` installer. It installs for all
              users and asks once for an administrator, so it can let the tablets on the local
              network through Windows Firewall. An older per-user install of the same Windows
              account is replaced; matches and backups stay. (A standard account that types an
              administrator's password keeps its older copy too: remove it in Settings › Apps.)
            - **Linux (AppImage)**: download, `chmod +x` it, run it.
            - **Linux (Debian/Ubuntu)**: `curl -fsSL https://get.openvolley.app/install.sh | sudo sh`
              (signed APT repository, package `openvolley-escoresheet`; `sudo apt upgrade` keeps it current),
              or download the `.deb` and `sudo apt install ./openvolley-escoresheet_*_amd64.deb`.

            ### Updates
            From 2.2.0 the app updates itself: it downloads in the background and installs when
            you quit, never during a match. On Windows each update asks once for an administrator.
            Versions before 2.2.0: install 2.2.0 once by hand (APT users: `sudo apt update && sudo apt upgrade`).
          files: |
            artifacts/escoresheet-desktop-windows/**/*.exe
            artifacts/escoresheet-desktop-linux/**/*.AppImage
            artifacts/escoresheet-desktop-linux/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
