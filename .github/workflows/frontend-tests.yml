name: Frontend tests

# The whole frontend suite (vitest: scoring rules, sync, relays, backups, the
# role apps) on every pull request and every push to main, whatever it
# changes: a backend, shared or workflow change can break it too. Cloudflare
# Pages builds the web apps from main and every desktop and Android release
# carries main, so this is the check to require before a merge to main.
# An unhandled error fails the run like a failed test (vitest exits 1).
# The relay tests that need the desktop app's Rust relay skip here; they run
# in relay-contract.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: escoresheet/frontend
        run: npm ci

      - name: Run tests
        working-directory: escoresheet/frontend
        run: npx vitest run
