name: Scoresheet pixels

# The scoresheet PDF checked by pixel (escoresheet/frontend/scripts/sheet-pixels.mjs,
# field-spec 17.13): a synthetic match drawn and saved through the real capture
# path in Chromium (forced device scale factor 1, 1.25, 1.75) and WebKit (1.5),
# on the standalone page and under the manager's stylesheet; every row rule,
# box bottom, the deciding set's right rule and the APPROVAL names' descenders
# are read back from the picture inside the PDF. The frontend suite (vitest,
# jsdom) cannot see any of these: they broke on 2026-11-16 with every test green.
on:
  push:
    branches: [main]
    paths:
      - 'escoresheet/frontend/scoresheet_pdf/**'
      - 'escoresheet/frontend/src/tailwind.css'
      - 'escoresheet/frontend/src/styles.css'
      - 'escoresheet/frontend/src/ui/tokens.css'
      - 'escoresheet/frontend/vite.config.js'
      - 'escoresheet/frontend/vite-plugin-html-to-image-font-size.js'
      - 'escoresheet/frontend/package-lock.json'
      - 'escoresheet/frontend/scripts/sheet-pixels.mjs'
      - '.github/workflows/sheet-pixels.yml'
  pull_request:
    paths:
      - 'escoresheet/frontend/scoresheet_pdf/**'
      - 'escoresheet/frontend/src/tailwind.css'
      - 'escoresheet/frontend/src/styles.css'
      - 'escoresheet/frontend/src/ui/tokens.css'
      - 'escoresheet/frontend/vite.config.js'
      - 'escoresheet/frontend/vite-plugin-html-to-image-font-size.js'
      - 'escoresheet/frontend/package-lock.json'
      - 'escoresheet/frontend/scripts/sheet-pixels.mjs'
      - '.github/workflows/sheet-pixels.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheet-pixels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: escoresheet/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: escoresheet/frontend
        run: npm ci

      # Playwright only for this job: not a dependency of the app (no lockfile change)
      - name: Install Playwright and its browsers
        working-directory: escoresheet/frontend
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium webkit

      - name: Check the PDF by pixel
        working-directory: escoresheet/frontend
        run: node scripts/sheet-pixels.mjs --verbose --keep sheet-pixels-out

      - name: Keep the PDFs of a failed check
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sheet-pixels
          path: escoresheet/frontend/sheet-pixels-out
          retention-days: 7
