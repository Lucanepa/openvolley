# openscore runtime config. openscore.py reads [DISPLAY] width/height and [TCP] port.
# The [DISPLAY] driver-tuning keys below are read by flushBuffer2's startled script on the
# board (mirrors the vendor setting.ini) — openscore itself only needs width/height here.
#
# CRITICAL: multiplexing / pwm_bits / hardware_mapping describe the PHYSICAL panel. Setting
# the wrong multiplexing scrambles the panel into garbage, and because that only affects how
# the panel is DRIVEN (not buffer.png), the scramble is INVISIBLE over the network. Change
# these only with a human watching the panel. Values below are KSCW's Model D (Pi 4 outdoor).

[DISPLAY]
# Physical panel geometry — 3 x (64x64) HUB75 chained = 192x64. Do not change.
width=192
height=64
hardware_mapping=applicon
pwm_lsb_nanoseconds=450
slowdown_gpio=5
pwm_bits=7
multiplexing=1
no_hardware_pulsing=0
pwm_dither=2
# brightness is the one safe knob (dims/brightens, never scrambles). 40 indoors, ~100 outdoors.
brightness=40

[TCP]
# Control port the bridge connects to. The vendor firmware uses 8889; keep it so the bridge
# needs no reconfiguration.
port=8889
