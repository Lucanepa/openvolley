<!doctype html>
<!-- Virtual LedBox — a 1:1 web mirror of the physical Tech4Sport board. Renders the
     exact section map the appliance pushes over the wire (GET /api/board), so you can
     eyeball the scoreboard without the hardware in front of you. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual LedBox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%23050608'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23f59e0b' font-family='monospace' font-weight='bold'%3E88%3C/text%3E%3C/svg%3E">
<style>
  :root { --amber:#ffb020; --dim:#3a3320; --off:#1e1e1e; --bezel:#0b0d10; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#050608; color:#e6edf3;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  body { display:flex; flex-direction:column; align-items:center;
    justify-content:center; min-height:100dvh; padding:14px; gap:12px; }

  /* Top status chip */
  .bar { display:flex; align-items:center; gap:10px; font-size:13px; color:#8b949e;
    flex-wrap:wrap; justify-content:center; }
  .bar .chip { display:inline-flex; align-items:center; gap:6px; padding:4px 11px;
    background:#11161d; border:1px solid #232b36; border-radius:20px; }
  .bar b { color:#e6edf3; font-weight:700; }
  .bar a { color:#2f81f7; text-decoration:none; }
  #live { color:#f85149; }
  #live.ok { color:#3fb950; }

  /* The physical board: a black LED matrix panel in a dark bezel. */
  .board { width:min(96vw, 960px); aspect-ratio: 16 / 7; background:#000;
    border-radius:14px; border:2px solid #16181c;
    box-shadow: 0 0 0 10px var(--bezel), 0 22px 60px rgba(0,0,0,.7), inset 0 0 60px rgba(0,0,0,.9);
    position:relative; overflow:hidden;
    display:grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr auto;
    padding: clamp(10px, 2.6vw, 26px) clamp(12px, 3vw, 34px);
    gap: clamp(4px, 1.2vw, 12px) clamp(8px, 2vw, 22px);
    font-variant-numeric: tabular-nums; }
  /* LED-dot texture overlay — sells the "matrix panel" look. */
  .board::after { content:""; position:absolute; inset:0; pointer-events:none;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);
    background-size: 6px 6px; mix-blend-mode: screen; }

  .team { text-transform:uppercase; letter-spacing:.06em; font-weight:800;
    font-size: clamp(15px, 4.4vw, 40px); line-height:1; align-self:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .team.t1 { grid-column:1; grid-row:1; text-align:left; }
  .team.t2 { grid-column:3; grid-row:1; text-align:right; }

  /* Big current-set points — the dominant element, like the real board. */
  .score { font-family: "DSEG7", ui-monospace, "SF Mono", Menlo, monospace;
    font-weight:800; font-size: clamp(58px, 17vw, 168px); line-height:.9;
    align-self:center; }
  .score.s1 { grid-column:1; grid-row:2; text-align:left; }
  .score.s2 { grid-column:3; grid-row:2; text-align:right; }

  /* Centre column: sets won (match score) + set number. */
  .centre { grid-column:2; grid-row:2; align-self:center; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:6px; }
  .sets { font-weight:800; font-size: clamp(30px, 8vw, 84px); line-height:1;
    color:#fff; text-shadow:0 0 10px rgba(255,255,255,.35); letter-spacing:.04em; }
  .sets .dash { color:#4a5260; margin:0 .12em; text-shadow:none; }
  .setno { font-size: clamp(9px, 2vw, 15px); letter-spacing:.22em; color:#6b7480;
    text-transform:uppercase; }

  /* Bottom row per side: serve rectangle + T/S counters. */
  .foot { display:flex; align-items:center; gap: clamp(6px, 1.6vw, 16px);
    align-self:end; font-weight:700; }
  .foot.f1 { grid-column:1; grid-row:3; justify-content:flex-start; }
  .foot.f2 { grid-column:3; grid-row:3; justify-content:flex-end; }
  .serve { width: clamp(26px, 6vw, 60px); height: clamp(9px, 1.8vw, 16px);
    border-radius:3px; background:var(--off); box-shadow: inset 0 0 6px rgba(0,0,0,.8);
    transition: background .12s, box-shadow .12s; }
  .ts { display:flex; gap: clamp(6px, 1.4vw, 14px); font-size: clamp(11px, 2.4vw, 22px);
    color:var(--dim); letter-spacing:.03em; }
  .ts .k { color:#6b7480; font-weight:800; }
  .ts b { color:var(--amber); font-weight:800; }

  /* Countdown overlay (timeout / interval / side switch). */
  .cd { position:absolute; inset:0; z-index:6; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap: clamp(2px, 1vw, 10px);
    background:rgba(0,0,0,.74); }
  .cd[hidden] { display:none; }
  .cd-label { max-width:90%; text-align:center; text-transform:uppercase;
    letter-spacing:.16em; font-weight:800; font-size: clamp(12px, 3vw, 28px);
    color:var(--amber); text-shadow:0 0 .35em var(--amber); }
  .cd-time { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight:800;
    font-size: clamp(56px, 17vw, 150px); line-height:1; color:#fff;
    text-shadow:0 0 .22em rgba(255,255,255,.55); font-variant-numeric:tabular-nums; }

  /* Everything is dark until data lands, so a lost feed reads as "board off". */
  .board.stale { filter: grayscale(.4) brightness(.5); }
  .hint { font-size:12px; color:#6b7480; text-align:center; max-width:960px; }
</style>

<div class="bar">
  <span class="chip"><span id="live">●</span> <span id="conn">connecting…</span></span>
  <span class="chip">mode <b id="mode">—</b></span>
  <span class="chip">layout <b id="layout">—</b></span>
  <span class="chip"><a href="/">← Control</a></span>
</div>

<div class="board stale" id="board">
  <div class="team t1" id="team1">—</div>
  <div class="team t2" id="team2">—</div>
  <div class="score s1" id="score1">0</div>
  <div class="centre">
    <div class="sets"><span id="set1">0</span><span class="dash">–</span><span id="set2">0</span></div>
    <div class="setno" id="setno"></div>
  </div>
  <div class="score s2" id="score2">0</div>
  <div class="foot f1">
    <span class="serve" id="serve1"></span>
    <span class="ts"><span class="k">T</span><b id="timeout1">0</b> <span class="k">S</span><b id="sub1">0</b></span>
  </div>
  <div class="foot f2">
    <span class="ts"><span class="k">T</span><b id="timeout2">0</b> <span class="k">S</span><b id="sub2">0</b></span>
    <span class="serve" id="serve2"></span>
  </div>
  <!-- Timeout / interval / side-switch countdown, overlaid on the board. -->
  <div class="cd" id="cd" hidden>
    <div class="cd-label" id="cdLabel"></div>
    <div class="cd-time" id="cdTime">0:00</div>
  </div>
</div>

<p class="hint">1:1 mirror of the physical LedBox — shows the exact frame the appliance is pushing. Serve rectangles light in the serving team's colour.</p>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const OFF = "30,30,30"; // the mapper's "serve indicator dark" colour
  const ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII"];

  // Countdown: server sends remainingMs each poll; we anchor a local deadline and
  // tick it smoothly between polls (re-synced on every /api/board response).
  let cdEndsAt = 0, cdLabel = "";
  const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  function renderCountdown() {
    const left = cdEndsAt - Date.now();
    if (cdEndsAt && left > 0) {
      $("cdLabel").textContent = cdLabel;
      $("cdTime").textContent = fmt(left);
      $("cd").hidden = false;
    } else {
      cdEndsAt = 0;
      $("cd").hidden = true;
    }
  }

  // "r,g,b" -> "rgb(r,g,b)"; blank/invalid -> a dim fallback.
  const rgb = (c, fb = "rgb(120,120,120)") =>
    /^\d{1,3},\d{1,3},\d{1,3}$/.test(String(c || "").trim()) ? `rgb(${c})` : fb;

  // Paint a text section with its LED colour + a matching glow.
  function paintText(id, sec, fallback) {
    const el = $(id);
    const text = sec && sec.text != null ? String(sec.text) : "";
    el.textContent = text === "" ? "—" : text;
    const col = rgb(sec && sec.color, fallback || "rgb(230,237,243)");
    el.style.color = col;
    el.style.textShadow = `0 0 .28em ${col}`;
  }

  // Serve rectangle: lit in the team colour when serving, dark otherwise.
  function paintServe(id, sec) {
    const el = $(id);
    const c = sec && sec.color;
    const lit = c && String(c).trim() !== OFF;
    if (lit) {
      const col = rgb(c, "rgb(255,176,32)");
      el.style.background = col;
      el.style.boxShadow = `0 0 10px ${col}, 0 0 3px ${col}`;
    } else {
      el.style.background = "var(--off)";
      el.style.boxShadow = "inset 0 0 6px rgba(0,0,0,.8)";
    }
  }

  function render(data) {
    const sc = (data && data.screen) || {};
    paintText("team1", sc.team1);
    paintText("team2", sc.team2);
    paintText("score1", sc.score1, "rgb(255,176,32)");
    paintText("score2", sc.score2, "rgb(255,176,32)");
    // Sets-won + T/S have no colour from the mapper — render them neutral/amber.
    $("set1").textContent = (sc.set1 && sc.set1.text) ?? "0";
    $("set2").textContent = (sc.set2 && sc.set2.text) ?? "0";
    $("timeout1").textContent = (sc.timeout1 && sc.timeout1.text) ?? "0";
    $("timeout2").textContent = (sc.timeout2 && sc.timeout2.text) ?? "0";
    $("sub1").textContent = (sc.sub1 && sc.sub1.text) ?? "0";
    $("sub2").textContent = (sc.sub2 && sc.sub2.text) ?? "0";
    paintServe("serve1", sc.serve1);
    paintServe("serve2", sc.serve2);

    // Derived "SET n" label from the sets total (nicety; not a board section).
    const a = Number((sc.set1 && sc.set1.text) || 0), b = Number((sc.set2 && sc.set2.text) || 0);
    $("setno").textContent = (a >= 3 || b >= 3) ? "FINAL" : "SET " + (ROMAN[Math.min(5, a + b + 1)] || (a + b + 1));

    // Countdown overlay (timeout / interval / side switch).
    const cd = data && data.countdown;
    if (cd && cd.remainingMs > 0) { cdEndsAt = Date.now() + cd.remainingMs; cdLabel = cd.label || ""; }
    else { cdEndsAt = 0; }
    renderCountdown();

    $("mode").textContent = data.mode || "—";
    $("layout").textContent = data.layout || "—";
    const connected = !!data.connected;
    $("live").className = connected ? "ok" : "";
    $("conn").textContent = connected ? "LedBox connected" : "no LedBox (mirror only)";
    $("board").classList.remove("stale");
  }

  async function poll() {
    try {
      const r = await fetch("/api/board", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    } catch {
      $("board").classList.add("stale");
      $("live").className = "";
      $("conn").textContent = "feed offline";
      cdEndsAt = 0; renderCountdown();
    }
  }

  poll();
  setInterval(poll, 500);
  setInterval(renderCountdown, 250); // smooth local tick between polls
})();
</script>
