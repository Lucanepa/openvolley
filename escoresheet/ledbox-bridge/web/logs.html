<!doctype html>
<!-- LedBox appliance — log viewer. Live-tails the appliance's structured log over SSE
     (GET /api/logs/stream), with the last few hundred entries fetched up front. Same
     Console styling as the controller: white ground, hairline borders, mono numerals;
     the only colour on the page is the severity of a line. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KSCW Scoreboard — Logs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='10' fill='%23ffffff' stroke='%23111318' stroke-width='8'/%3E%3Cg stroke='%230A34D6' stroke-width='9' stroke-linecap='round'%3E%3Cpath d='M26 34h48'/%3E%3Cpath d='M26 52h48'/%3E%3Cpath d='M26 70h30'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --fill:#fafafc; --fg:#0A0B0D; --muted:#5a606b;
    --line:#111318; --line-soft:#e3e5ea;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --blue:#0A34D6; --gold:#B45309;
    --ok:#12813f; --warn:#B45309; --bad:#E0301A;
    --r:3px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button,input,select{font-family:inherit}
  :focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
  #app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}

  /* ---- chrome ---- */
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:15px;white-space:nowrap}
  .brand a{color:var(--muted);text-decoration:none;font-weight:700}
  .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:12px;font-weight:700;
    border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);white-space:nowrap}
  .chip .n{font-family:var(--mono);font-variant-numeric:tabular-nums}
  #liveChip .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  #liveChip.on .dot{background:var(--ok)} #liveChip.off .dot{background:var(--bad)}
  #liveChip.paused .dot{background:var(--gold)}
  .cWarn{color:var(--warn)} .cBad{color:var(--bad)} .cMuted{color:var(--muted)}

  button.btn{min-height:36px;padding:0 12px;font-size:13px;font-weight:700;line-height:1;cursor:pointer;
    border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:var(--r)}
  button.btn:active{background:var(--fill)}
  button.btn.on{color:var(--blue);border-color:var(--fg)}
  button.btn.danger{color:var(--bad)}
  a.btn{min-height:36px;display:inline-flex;align-items:center;padding:0 12px;font-size:13px;font-weight:700;
    border:1.5px solid var(--line);border-radius:var(--r);color:var(--fg);text-decoration:none}

  .filters{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px 8px;flex-wrap:wrap}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
  .seg button{min-height:34px;padding:0 11px;font-size:12px;font-weight:800;letter-spacing:.04em;cursor:pointer;
    border:0;border-right:1.5px solid var(--line-soft);background:var(--card);color:var(--muted)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--fill);color:var(--fg)}
  .seg button.on[data-level="warn"]{color:var(--warn)}
  .seg button.on[data-level="error"]{color:var(--bad)}
  .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  input#q{min-height:34px;min-width:150px;flex:1;padding:0 10px;font-size:14px;
    border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--fg)}
  #scopes{display:flex;gap:6px;flex-wrap:wrap}
  #scopes button{min-height:30px;padding:0 9px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--mono);
    border:1.5px solid var(--line-soft);border-radius:var(--r);background:var(--card);color:var(--muted)}
  #scopes button.on{border-color:var(--line);color:var(--fg);background:var(--fill)}

  /* ---- the log itself ---- */
  main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border-top:1.5px solid var(--line);
    background:var(--card);-webkit-overflow-scrolling:touch}
  .row{display:grid;grid-template-columns:auto auto auto 1fr;gap:8px;align-items:baseline;
    padding:5px 12px;border-bottom:1px solid var(--line-soft);font-size:13px;cursor:pointer}
  .row:hover{background:var(--fill)}
  .row .t{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
  .row .lv{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.06em}
  .row .sc{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--blue);white-space:nowrap}
  .row .msg{min-width:0;overflow-wrap:anywhere}
  .row.error{background:#fff5f4} .row.error .lv{color:var(--bad)}
  .row.warn{background:#fffaf2} .row.warn .lv{color:var(--warn)}
  .row.info .lv{color:var(--fg)}
  .row.debug{color:var(--muted)} .row.debug .lv{color:var(--muted)} .row.debug .sc{color:var(--muted)}
  .row .data{grid-column:1/-1;margin:6px 0 2px;padding:8px 10px;font-family:var(--mono);font-size:12px;
    white-space:pre-wrap;overflow-wrap:anywhere;background:var(--fill);border:1px solid var(--line-soft);
    border-radius:var(--r);color:var(--fg)}
  .row .data[hidden]{display:none}
  .row.hasData .msg::after{content:" ▸";color:var(--muted);font-size:11px}
  .row.open.hasData .msg::after{content:" ▾"}
  #empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:14px}

  .statusbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 12px;flex-wrap:wrap;
    border-top:1.5px solid var(--line);font-size:12px;color:var(--muted)}
  .statusbar b{color:var(--fg);font-family:var(--mono);font-variant-numeric:tabular-nums}
  #jump{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;z-index:5}

  /* Confirm — never a native dialog on a venue tablet (it blocks the event loop). */
  #confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(10,11,13,.45);padding:16px}
  #confirm[hidden]{display:none}
  .box{width:min(420px,100%);background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
  .box p{margin:0 0 14px;font-size:15px;font-weight:600}
  .box .btns{display:flex;gap:8px;justify-content:flex-end}
  #pinWrap[hidden]{display:none}
  #pin{min-height:34px;width:96px;padding:0 10px;font-family:var(--mono);font-size:14px;
    border:1.5px solid var(--line);border-radius:var(--r)}
</style>

<div id="app">
  <header class="topbar">
    <span class="brand">LedBox · Logs &nbsp;<a href="/">← Controller</a></span>
    <span class="spacer"></span>
    <span class="chip" id="liveChip"><span class="dot"></span><span id="liveTxt">connecting…</span></span>
    <span class="chip cBad" title="errors since boot">ERR <span class="n" id="cErr">0</span></span>
    <span class="chip cWarn" title="warnings since boot">WARN <span class="n" id="cWarn">0</span></span>
    <button class="btn" id="pauseBtn" title="Freeze the view — the appliance keeps logging">Pause</button>
    <a class="btn" id="dlBtn" href="/api/logs/export" download>Download</a>
    <button class="btn danger" id="clearBtn">Clear</button>
  </header>

  <div class="filters">
    <span class="lbl">Show</span>
    <div class="seg" id="levelSeg">
      <button data-level="debug">DEBUG</button>
      <button data-level="info" class="on">INFO</button>
      <button data-level="warn">WARN</button>
      <button data-level="error">ERROR</button>
    </div>
    <input id="q" type="search" placeholder="Search message, scope or data…" autocomplete="off">
    <span class="lbl">Scopes</span>
    <div id="scopes"></div>
  </div>

  <main id="list"><div id="empty">Waiting for the first entry…</div></main>

  <footer class="statusbar">
    <span><b id="shown">0</b> shown · <b id="held">0</b> held in memory</span>
    <span class="spacer"></span>
    <span class="lbl">Recording level</span>
    <div class="seg" id="recSeg">
      <button data-level="debug" title="Everything, including every board write and HTTP request">DEBUG</button>
      <button data-level="info">INFO</button>
      <button data-level="warn">WARN</button>
      <button data-level="error">ERROR</button>
    </div>
    <span id="files"></span>
  </footer>
</div>

<button class="btn on" id="jump" hidden>↓ new entries</button>

<div id="confirm" hidden>
  <div class="box">
    <p id="confirmMsg">Confirm</p>
    <div class="btns">
      <span id="pinWrap" hidden><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"></span>
      <button class="btn" id="confirmNo">Cancel</button>
      <button class="btn danger" id="confirmYes">Confirm</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const LEVELS = { debug: 10, info: 20, warn: 30, error: 40 };
  const MAX_ROWS = 1500;              // DOM cap — a long tournament would otherwise grow forever
  let viewLevel = "info";             // what this page SHOWS (client-side)
  let scopeFilter = new Set();        // empty = all scopes
  let search = "";
  let paused = false;
  let pending = [];                   // entries that arrived while paused
  let lastId = 0;
  let knownScopes = [];
  let es = null;

  // Same PIN the controller stores, so a locked board doesn't ask twice.
  let PIN = ""; try { PIN = localStorage.getItem("kscwScorerPin") || ""; } catch {}

  const listEl = $("list"), emptyEl = $("empty");

  // ---- rendering ----------------------------------------------------------
  const hhmmss = (iso) => { const d = new Date(iso); return Number.isNaN(+d) ? String(iso).slice(11, 19) : d.toTimeString().slice(0, 8); };
  const LV = { debug: "DBG", info: "INF", warn: "WRN", error: "ERR" };

  function matches(e) {
    if (LEVELS[e.level] < LEVELS[viewLevel]) return false;
    if (scopeFilter.size && !scopeFilter.has(e.scope)) return false;
    if (search) {
      const hay = (e.scope + " " + e.msg + " " + (e.data === undefined ? "" : JSON.stringify(e.data))).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  }

  function rowFor(e) {
    const row = document.createElement("div");
    row.className = "row " + e.level + (e.data === undefined ? "" : " hasData");
    row.dataset.id = e.id;
    const t = document.createElement("span"); t.className = "t"; t.textContent = hhmmss(e.ts);
    const lv = document.createElement("span"); lv.className = "lv"; lv.textContent = LV[e.level] || e.level;
    const sc = document.createElement("span"); sc.className = "sc"; sc.textContent = e.scope;
    const msg = document.createElement("span"); msg.className = "msg"; msg.textContent = e.msg;
    row.append(t, lv, sc, msg);
    if (e.data !== undefined) {
      const pre = document.createElement("pre"); pre.className = "data"; pre.hidden = true;
      pre.textContent = JSON.stringify(e.data, null, 2);
      row.appendChild(pre);
      row.addEventListener("click", () => {
        pre.hidden = !pre.hidden;
        row.classList.toggle("open", !pre.hidden);
      });
    }
    return row;
  }

  // Within ~40px of the bottom counts as "following the tail".
  const atBottom = () => listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 40;

  function append(entries) {
    const follow = atBottom();
    let added = 0;
    for (const e of entries) {
      // An entry that arrives over SSE while a filter reload is in flight can be in BOTH the
      // fetched page and the stream. Ids only ever move forward, so anything at or below the
      // high-water mark is the only case that needs the (cheap) duplicate check.
      if (e.id <= lastId && listEl.querySelector(`.row[data-id="${e.id}"]`)) continue;
      if (e.id > lastId) lastId = e.id;
      if (!matches(e)) continue;
      listEl.appendChild(rowFor(e));
      added++;
    }
    if (!added) return;
    emptyEl.hidden = true;
    while (listEl.querySelectorAll(".row").length > MAX_ROWS) listEl.querySelector(".row").remove();
    $("shown").textContent = listEl.querySelectorAll(".row").length;
    if (follow) listEl.scrollTop = listEl.scrollHeight;
    else $("jump").hidden = false;
  }

  // A filter change re-renders from the buffer the SERVER holds, so switching to DEBUG shows
  // what was recorded before the switch rather than only what arrives next.
  async function reload() {
    try {
      const r = await fetch("/api/logs?limit=1500", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const { entries, stats } = await r.json();
      listEl.querySelectorAll(".row").forEach((n) => n.remove());
      lastId = 0;
      append(entries);
      applyStats(stats);
      emptyEl.hidden = listEl.querySelector(".row") != null;
      emptyEl.textContent = listEl.querySelector(".row") ? "" : "Nothing matches these filters.";
      listEl.scrollTop = listEl.scrollHeight;
    } catch (err) {
      setLive("off", "cannot reach the appliance");
    }
  }

  function applyStats(s) {
    if (!s) return;
    $("cErr").textContent = s.counts.error;
    $("cWarn").textContent = s.counts.warn;
    $("held").textContent = s.buffered;
    $("files").textContent = (s.files || []).map((f) => `${f.name} ${(f.bytes / 1024).toFixed(0)}KB`).join(" · ");
    for (const b of $("recSeg").children) b.classList.toggle("on", b.dataset.level === s.level);
    // Scope chips are built from what has actually been logged, so they never drift from the code.
    if (s.scopes && s.scopes.join() !== knownScopes.join()) {
      knownScopes = s.scopes;
      const box = $("scopes");
      box.textContent = "";
      for (const sc of knownScopes) {
        const b = document.createElement("button");
        b.textContent = sc;
        b.className = scopeFilter.has(sc) ? "on" : "";
        b.addEventListener("click", () => {
          if (scopeFilter.has(sc)) scopeFilter.delete(sc); else scopeFilter.add(sc);
          b.classList.toggle("on");
          reload();
        });
        box.appendChild(b);
      }
    }
  }

  function setLive(state, text) {
    const chip = $("liveChip");
    chip.className = "chip " + state;
    $("liveTxt").textContent = text;
  }

  // ---- live tail ----------------------------------------------------------
  function connect() {
    if (es) es.close();
    // Ask for everything; this page filters locally so changing the view never reconnects.
    es = new EventSource(`/api/logs/stream?sinceId=${lastId}`);
    es.onopen = () => setLive("on", "live");
    es.onmessage = (ev) => {
      let e; try { e = JSON.parse(ev.data); } catch { return; }
      if (paused) { pending.push(e); $("jump").hidden = false; $("jump").textContent = `↓ ${pending.length} new`; return; }
      append([e]);
      if (e.level === "error") $("cErr").textContent = Number($("cErr").textContent) + 1;
      if (e.level === "warn") $("cWarn").textContent = Number($("cWarn").textContent) + 1;
    };
    // EventSource reconnects on its own; say so rather than looking dead.
    es.onerror = () => setLive("off", "reconnecting…");
  }

  // ---- controls -----------------------------------------------------------
  for (const b of $("levelSeg").children) {
    b.addEventListener("click", () => {
      viewLevel = b.dataset.level;
      for (const x of $("levelSeg").children) x.classList.toggle("on", x === b);
      reload();
    });
  }

  let qTimer = null;
  $("q").addEventListener("input", (ev) => {
    search = ev.target.value.trim().toLowerCase();
    clearTimeout(qTimer);
    qTimer = setTimeout(reload, 180);
  });

  $("pauseBtn").addEventListener("click", () => {
    paused = !paused;
    $("pauseBtn").textContent = paused ? "Resume" : "Pause";
    $("pauseBtn").classList.toggle("on", paused);
    setLive(paused ? "paused" : "on", paused ? "paused (still recording)" : "live");
    if (!paused && pending.length) { append(pending); pending = []; $("jump").hidden = true; }
  });

  $("jump").addEventListener("click", () => {
    if (pending.length) { append(pending); pending = []; }
    listEl.scrollTop = listEl.scrollHeight;
    $("jump").hidden = true;
    $("jump").textContent = "↓ new entries";
  });
  listEl.addEventListener("scroll", () => { if (atBottom() && !pending.length) $("jump").hidden = true; });

  // Recording level — this one changes what the APPLIANCE keeps, so it needs the scorer PIN.
  for (const b of $("recSeg").children) {
    b.addEventListener("click", async () => {
      const level = b.dataset.level;
      const ok = await post("/api/logs/level", { level });
      if (ok) { for (const x of $("recSeg").children) x.classList.toggle("on", x === b); reload(); }
    });
  }

  $("clearBtn").addEventListener("click", async () => {
    if (!(await askConfirm("Delete every recorded log entry, in memory and on the card?"))) return;
    if (await post("/api/logs/clear", {})) { lastId = 0; reload(); }
  });

  // POST with the scorer PIN; on a 403 ask for it once and retry. Returns true on success.
  async function post(path, body) {
    const send = () => fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json", "X-Scorer-Pin": PIN },
      body: JSON.stringify(body),
    });
    let r = await send();
    if (r.status === 403) {
      const pin = await askConfirm("This board is locked — enter the scorer PIN.", true);
      if (!pin) return false;
      PIN = pin; try { localStorage.setItem("kscwScorerPin", pin); } catch {}
      r = await send();
    }
    return r.ok;
  }

  // ---- confirm (no native dialogs on a venue tablet) ----------------------
  let confirmResolve = null;
  function askConfirm(msg, wantPin = false) {
    $("confirmMsg").textContent = msg;
    $("pinWrap").hidden = !wantPin;
    $("pin").value = "";
    $("confirm").hidden = false;
    if (wantPin) setTimeout(() => $("pin").focus(), 30);
    return new Promise((res) => { confirmResolve = res; });
  }
  function closeConfirm(value) {
    $("confirm").hidden = true;
    const r = confirmResolve; confirmResolve = null;
    if (r) r(value);
  }
  $("confirmNo").addEventListener("click", () => closeConfirm(false));
  $("confirmYes").addEventListener("click", () => closeConfirm($("pinWrap").hidden ? true : $("pin").value.trim()));
  $("pin").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("confirmYes").click(); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !$("confirm").hidden) closeConfirm(false); });

  // This page reports its own faults to the same log it displays.
  const report = (msg, data) => {
    try {
      fetch("/api/logs", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ level: "error", msg, data: { ...data, page: "logs" } }),
      }).catch(() => {});
    } catch { /* nothing left to try */ }
  };
  window.addEventListener("error", (ev) => report(`logs page error: ${ev.message}`, { file: ev.filename, line: ev.lineno }));
  window.addEventListener("unhandledrejection", (ev) => report("logs page promise rejection", { reason: String(ev.reason).slice(0, 300) }));

  // Stats (counters, scope chips, file sizes) refresh on a slow poll; entries arrive over SSE.
  reload().then(connect);
  setInterval(async () => {
    try {
      const r = await fetch("/api/logs?limit=1", { cache: "no-store" });
      if (r.ok) applyStats((await r.json()).stats);
    } catch { /* the SSE indicator already reports the outage */ }
  }, 5000);
})();
</script>
