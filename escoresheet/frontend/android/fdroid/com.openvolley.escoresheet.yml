    versionCode: 30010030
    commit: 830bb7299d67195e978ec7e1e49f5add9046f67d
    subdir: escoresheet/frontend/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - cd ../..
      - npm ci --ignore-scripts
    gradle:
      - yes
    prebuild:
      - cd ../..
      - CAPACITOR=true VITE_BACKEND_URL=https://backend.openvolley.app npx vite build
        --outDir dist-capacitor --emptyOutDir
      - npx cap sync android
    scanignore:
      - escoresheet/frontend/node_modules/pdfjs-dist/iccs
    scandelete:
      - escoresheet/frontend/node_modules

