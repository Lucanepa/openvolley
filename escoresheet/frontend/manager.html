<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Prepare your team's squad and the roster of each game for the OpenVolley eScoresheet. Clubs, invite codes and official games for competition managers." />
    <!-- The link preview (WhatsApp, Signal, mail): team links are the links people share from here.
         Static: the team link's code rides in the URL fragment, which never reaches this page's server. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenVolley" />
    <meta property="og:title" content="OpenVolley Manager" />
    <meta property="og:description" content="Prepare your team's squad and the roster of each game for the eScoresheet." />
    <meta property="og:url" content="https://manager.openvolley.app/" />
    <meta property="og:image" content="https://manager.openvolley.app/og-manager.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenVolley Manager: team rosters for the eScoresheet" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- An admin console: never in a search index (the build also writes robots.txt and an X-Robots-Tag header) -->
    <meta name="robots" content="noindex, nofollow" />
    <title>OpenVolley Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/manager-main.jsx"></script>
  </body>
</html>
