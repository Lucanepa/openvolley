# cargo audit settings for the desktop app (read by the Dependency audit workflow).
[advisories]
# zip 4.6.1 comes only through tauri-plugin-updater ~2.13 and is compiled only for
# Windows, where the updater unpacks the downloaded update. The updater verifies the
# update's minisign signature (our key, tauri.conf.json) before it extracts anything,
# so a crafted archive needs our signing key. tauri-plugin-updater 2.14 has zip 9 but
# needs tauri 2.13+ and a newer Rust: remove these four with that upgrade.
ignore = [
  "RUSTSEC-2026-0367", # zip: SUID/SGID bits kept on extraction
  "RUSTSEC-2026-0368", # zip: symlink targets outside the destination
  "RUSTSEC-2026-0369", # zip: permissions applied through symlinks
  "RUSTSEC-2026-0429", # zip: abort on a symlink entry with a large declared size
]
