[package]
name = "openvolley-escoresheet"
version = "2.0.0"
description = "Open Source Volleyball eScoresheet"
authors = ["Luca Canepa"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# native "open file" picker for restoring a backup (backup.rs)
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { version = "0.7", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
local-ip-address = "0.6"
futures-util = "0.3"

# GtkSettings: keep the window light on a dark GTK theme (main.rs). Already
# in the tree through tauri (wry/tao), so this adds no new crate.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# connect WebKit's window.close() of a popup to its app window (popups.rs);
# in the tree through wry, no new crate.
webkit2gtk = "2.0"

[dev-dependencies]
# mock runtime for the IPC/ACL test of the backup commands (main.rs)
tauri = { version = "2", features = ["test"] }

# Release profile tuned for a small, fast single binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
