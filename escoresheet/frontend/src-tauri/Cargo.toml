[package]
name = "openvolley-escoresheet"
version = "1.20.0"
description = "Openvolley eScoresheet — offline scoretable + LAN tablet server"
authors = ["Luca Canepa"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { version = "0.7", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
local-ip-address = "0.6"
futures-util = "0.3"

# Release profile tuned for a small, fast single binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
