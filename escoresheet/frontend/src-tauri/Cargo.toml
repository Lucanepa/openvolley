[package]
name = "openvolley-escoresheet"
version = "2.4.0"
description = "Open Source Volleyball eScoresheet"
authors = ["Luca Canepa"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs reads the Tauri config to tell OpenVolley from OpenBeach
# (src/flavour.rs). In the tree through tauri-build, no new crate.
serde_json = "1"

[dependencies]
# tray-icon: the app keeps running in the tray when its window is closed
# (lifecycle.rs). On Linux the tray loads libayatana-appindicator3 at run
# time (deb depends in tauri.linux.conf.json).
tauri = { version = "2", features = ["tray-icon"] }
# native "open file" picker for restoring a backup (backup.rs)
tauri-plugin-dialog = "2"
# A second launch shows the running app instead of failing on the busy
# relay ports ("Cannot bind HTTP port").
tauri-plugin-single-instance = "2"
# Automatic updates (updater.rs): latest.json from get.openvolley.app, the
# download verified against the minisign key in tauri.conf.json. 2.12 is the
# newest on tauri 2.11 (2.13 needs tauri 2.12 + Rust 1.90, same updater code).
# Its JS commands are not granted to any window (capabilities/update.json).
tauri-plugin-updater = "~2.12"
# The desktop log (main.rs): <data dir>/OpenVolley/logs/desktop.log, rotated.
# ~2.9: 2.10 needs Rust 1.90. None of its JS commands is granted to a window.
tauri-plugin-log = "~2.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.7", features = ["ws"] }
# The relay's embedded frontend comes from $OV_DIST (build.rs: OpenVolley's
# ../dist, or the openbeach build for OpenBeach).
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
local-ip-address = "0.6"
futures-util = "0.3"
# OS randomness for the tablet Wi-Fi password (hotspot.rs). Already in the
# tree (0.8 through tauri), so this adds no new crate.
rand = "0.8"
# Sign on phone (sign.rs): SHA-256 of the session secrets (already in the
# tree through tauri) and NFC for the context the phone page shows, the same
# as String.prototype.normalize('NFC') in electron/signSessionCore.cjs.
sha2 = "0.10"
unicode-normalization = "0.1"

# GtkSettings: keep the window light on a dark GTK theme (main.rs). Already
# in the tree through tauri (wry/tao), so this adds no new crate.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# connect WebKit's window.close() of a popup to its app window (popups.rs);
# in the tree through wry, no new crate.
webkit2gtk = "2.0"
# NetworkManager over D-Bus: the tablet Wi-Fi (hotspot) and the Bluetooth
# network (hotspot/linux.rs). On the tokio runtime the app already runs.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# probe for libayatana-appindicator3 / libappindicator3 before building the
# tray: tray-icon panics when neither loads (lifecycle.rs). In the tree
# through tray-icon, no new crate.
libloading = "0.7"

# Mobile Hotspot (WinRT tethering) and the Wi-Fi Direct legacy access point
# (hotspot/windows.rs). Same version as tauri's (wry/webview2-com), so only
# features are added.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Foundation_Metadata",
  "Networking_Connectivity",
  "Networking_NetworkOperators",
  "Devices_WiFiDirect",
  "Security_Credentials",
  "Win32_System_Com",
  # the installer's firewall rule for the tablets (firewall.rs, read only;
  # Ole + Variant: walking the rule list for Block rules)
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[dev-dependencies]
# mock runtime for the IPC/ACL test of the backup commands (main.rs)
tauri = { version = "2", features = ["test"] }
# Router tests of /api/sign/* (relay.rs): Router::oneshot and body reading,
# both already in the tree through axum
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# tokio::time::pause for the long-poll tests (sign.rs, relay.rs)
tokio = { version = "1", features = ["test-util"] }


# Release profile tuned for a small, fast single binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
