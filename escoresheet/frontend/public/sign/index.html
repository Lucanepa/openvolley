<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f5f4">
<title>OpenVolley</title>
<link rel="stylesheet" href="/sign/sign.css">
<script src="/sign/sign.js" defer></script>
</head>
<!-- Sign on phone (docs/qr-signing-spec.md 6): the signer's own phone draws the
     signature; the strokes go back to the scoring device. No app bundle, no
     fonts, no service worker, no cookies. The link's token is in the fragment. -->
<body>
<main class="page" data-state="loading">

<section class="who">
<h1 id="title"></h1>
<p id="teams" class="sub"></p>
<p id="meta" class="sub"></p>
<p id="name" class="name"></p>
</section>
<div id="padwrap" class="pad">
<canvas id="pad" role="img" aria-label="Signature pad"></canvas>
<span id="hint" class="hint" aria-hidden="true"></span>
</div>
<p id="status" class="status" role="status" aria-live="polite"></p>
<div class="actions">
<button id="clear" type="button" class="btn ghost"></button>
<button id="done" type="button" class="btn primary" disabled></button>
</div>
<section id="end" class="end" hidden aria-hidden="true">
<span id="endIcon" class="end-icon" aria-hidden="true"></span>
<p id="endText" class="end-text"></p>
</section>
</main>
</body>
</html>
